<!doctype html>
<html lang="en">
<head>
<title>Apps · Brewser</title>
<link rel="stylesheet" href="brewser://assets/main.css">
<style>
  body { padding: 32px 28px 28px; }
</style>
</head>
<body>
<div class="page-shell">
  <div class="app-grid" aria-label="Installed apps">
    <!-- Cards injected from apps.json by the resource loader. Each entry
         becomes an `.app-card` (logo + title + description). The logo is
         the entry's relative `logo` path used verbatim; the card link is
         the entry's `url` rewritten to a brewser:// URL. Edit apps.json
         to change what shows here. -->
    <browser-apps></browser-apps>
  </div>
</div>
</body>
</html>
