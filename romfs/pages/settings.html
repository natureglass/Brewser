<!doctype html>
<html lang="en">
<head>
<title>Settings — switch-web-browser</title>
<link rel="stylesheet" href="brewser://assets/main.css">
<style>
  body { padding: 28px 48px; }
  h2 { margin-top: 28px; }
</style>
</head>
<body>
<h1>Settings</h1>
<p class="lead">Tap a template to switch designs.</p>

<h2>Templates</h2>
<!-- The loader replaces <browser-templates> with a list of the
     entries registered in `templates.json`. The active row (per
     `config.json`) is rendered as a non-clickable "disabled" button;
     every other row is a `<button data-action="select-template:...">`
     whose tap the shell intercepts to rewrite `config.json` and
     reload. -->
<browser-templates></browser-templates>

<h2>Developer</h2>
<!-- Dev surface moved here from the home top-bar 2026-06-02 so the
     home page stays focused on Featured Apps. Single row pointing
     at brewser://dev/ (test fixtures + Khronos conformance corpora). -->
<ul class="settings-list">
  <li><a href="brewser://dev/">Dev experiments</a>
    <span class="desc">HTML / CSS / canvas / WebGL test fixtures and the full Khronos WebGL 1 / WebGL 2 conformance suites.</span>
  </li>
</ul>
</body>
</html>
