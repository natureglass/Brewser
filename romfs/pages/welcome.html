<!doctype html>
<html lang="en">
<head>
<title>Welcome to SwitchSurf!</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at top, rgba(122, 162, 255, 0.12), transparent 32%),
      #0b1220;
    color: #e0e8f4;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 18px;
    padding: 28px;
  }

  h1 { color: #ffd35e; margin-bottom: 4px; line-height: 1.12; }
  h2 { color: #7aa2ff; margin-top: 26px; }
  a { color: #7eda9f; }
  .lead { color: #9bb1d6; margin-top: 0; margin-bottom: 24px; }
  code, kbd { color: #c2e0ff; }
  .note {
    background-color: #14202d;
    padding: 10px 14px;
    margin-top: 14px;
    border-left: 3px solid #7aa2ff;
  }

  .page-shell {
    width: min(1280px, 100%);
    margin: 0 auto;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 54px;
  }

  .top-links {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .munch-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 112px;
    min-height: 46px;
    padding: 11px 20px;
    overflow: hidden;
    color: #eaf2ff;
    text-decoration: none;
    font-weight: 700;
    letter-spacing: 0.01em;
    background:
      radial-gradient(circle at top left, rgba(122, 162, 255, 0.28), transparent 36%),
      linear-gradient(135deg, #14202d, #10192a 72%);
    border: 1px solid rgba(122, 162, 255, 0.4);
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .munch-link:focus-visible {
    outline: 2px solid rgba(126, 218, 159, 0.72);
    outline-offset: 3px;
  }

  .search-section {
    display: flex;
    justify-content: center;
    margin: 0 auto 58px;
  }

  .search-form {
    display: flex;
    align-items: center;
    width: min(760px, 100%);
    min-height: 66px;
    padding: 8px;
    background:
      radial-gradient(circle at top left, rgba(122, 162, 255, 0.24), transparent 34%),
      linear-gradient(135deg, #14202d, #10192a 72%);
    border: 1px solid rgba(122, 162, 255, 0.42);
    border-radius: 999px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .search-logo {
    width: 42px;
    height: 42px;
    flex: 0 0 auto;
    margin-left: 12px;
    margin-right: 12px;
  }

  .search-input {
    flex: 1;
    min-width: 120px;
    border: none;
    outline: none;
    background: transparent;
    color: #eaf2ff;
    font: inherit;
    padding: 12px 8px;
  }

  .search-input::placeholder {
    color: #9bb1d6;
    opacity: 1;
  }

  .search-button {
    flex: 0 0 auto;
    border: none;
    cursor: pointer;
    color: #0b1220;
    background: linear-gradient(135deg, #ffd35e, #7eda9f);
    font: inherit;
    font-weight: 800;
    padding: 13px 22px;
    border-radius: 999px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
    transition: transform 160ms ease, box-shadow 160ms ease;
  }

  .search-button:hover,
  .search-button:focus-visible {
    transform: translateY(-1px);
    box-shadow: 0 12px 26px rgba(0, 0, 0, 0.28);
    outline: none;
  }

  .quick-links {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin: 18px 0 26px;
    max-width: 1280px;
  }

  .quick-card {
    position: relative;
    display: block;
    overflow: hidden;
    padding: 18px 18px 16px;
    min-height: 92px;
    color: #eaf2ff;
    text-decoration: none;
    background:
      radial-gradient(circle at top left, rgba(122, 162, 255, 0.28), transparent 36%),
      linear-gradient(135deg, #14202d, #10192a 72%);
    border: 1px solid rgba(122, 162, 255, 0.34);
    border-radius: 16px;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .quick-card strong {
    display: block;
    color: #ffd35e;
    font-size: 1.15em;
    margin-bottom: 8px;
  }

  .quick-card span {
    display: block;
    color: #9bb1d6;
    line-height: 1.35;
  }

  .quick-card::after {
    content: "›";
    position: absolute;
    right: 18px;
    bottom: 12px;
    color: #7eda9f;
    font-size: 34px;
    line-height: 1;
  }

  @media (max-width: 900px) {
    .quick-links {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 720px) {
    .top-bar {
      align-items: flex-start;
      flex-direction: column;
      margin-bottom: 38px;
    }

    .top-links {
      justify-content: flex-start;
    }
  }

  @media (max-width: 620px) {
    body {
      padding: 20px;
    }

    .munch-link {
      min-width: 96px;
      padding-inline: 16px;
    }

    .search-form {
      border-radius: 28px;
      align-items: stretch;
      flex-wrap: wrap;
      padding: 10px;
    }

    .search-logo {
      margin-top: 4px;
    }

    .search-input {
      flex: 1 1 calc(100% - 78px);
    }

    .search-button {
      width: 100%;
      margin-top: 8px;
    }

    .quick-links {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<div class="page-shell">
  <header class="top-bar">
    <a class="munch-link" href="browser://apps/">Apps</a>

    <nav class="top-links" aria-label="Browser navigation">
      <a class="munch-link" href="browser://history/">History</a>
      <a class="munch-link" href="browser://web-experiments/">Dev</a>
    </nav>
  </header>

  <section class="search-section" aria-label="Internet search">
    <!-- Search bar injected by the resource loader for the active
         engine (config.json `searchEngine` → search_engines.json):
         correct logo + the query routes to that engine. -->
    <browser-search></browser-search>
  </section>

  <div class="quick-links" aria-label="Quick website links">
    <!-- Cards injected from bookmarks.json by the resource loader. Each
         bookmark becomes a `.quick-card` (title + description) keeping
         the welcome-page design. Edit bookmarks.json (or star pages) to
         change what shows here. -->
    <browser-bookmarks format="cards"></browser-bookmarks>
  </div>
</div>
</body>
</html>
