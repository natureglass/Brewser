<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Twitch — dino_xx</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0e0c14;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  /* Full-viewport video stage. Twitch 16:9 sources fill 1280x720 cleanly. */
  .stage {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
  }
  .player {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
  }

  /* Status overlay covers the entire screen while we resolve the URL.
     Hidden BEFORE the <video> gets a src — the compositor paints the
     video surface OVER the DOM (memory: video-paints-over-dom), so an
     overlay sitting on top of an active video region would just show
     the video through it. */
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0e0c14;
    z-index: 10;
  }
  /* Explicit-width inner column. The live-DOM flex layout sizes
     children of a column flexbox to ~min-content (so text would
     wrap word-by-word against the logo's 96px). Pinning the inner
     column to a fixed width gives each child a defined cross-axis
     to lay out against. */
  .overlay-inner {
    width: 800px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  /* Text rows that should span the full inner-column width and center
     their content. Flat list since nested view containers below don't
     change the cascade rule (children would still hit the min-content
     trap without an explicit width — see memory swb-flex-column-min-content). */
  .status, .status-sub, .meta-title, .hint, .heading, .section-title {
    width: 100%;
    text-align: center;
  }

  /* ----- input view ----- */
  .input-view, .loading-view {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .heading {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #fff;
  }
  .input-row {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 22px;
    padding: 4px 16px;
    width: 460px;
  }
  .input-row .prefix {
    color: rgba(255, 255, 255, 0.5);
    font-size: 15px;
    font-weight: 500;
  }
  .input-row input {
    flex: 1;
    /* Explicit non-transparent bg is required: live-form.ts's
       resolveWidgetBg treats `transparent` as "use the theme default"
       and falls back to liveFormTheme.textFieldBg (white). White-on-
       white text → invisible value. See memory:
       swb-input-transparent-bg-trap. */
    background: rgba(255, 255, 255, 0.14);
    border: none;
    border-radius: 14px;
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    min-height: 38px;
    padding: 0 12px;
    margin-left: 4px;
  }
  .watch-btn {
    background: #9147ff;
    color: #fff;
    border-radius: 8px;
    padding: 12px 40px;
    font-size: 16px;
    font-weight: 700;
    /* Explicit min-width keeps the pill predictable; margin auto
       self-centers inside the flex column without depending on the
       align-items:center quirk (memory swb-flex-column-min-content). */
    min-width: 160px;
    margin: 0 auto;
    text-align: center;
  }
  .watch-btn:active { background: #6441a5; }
  .section-title {
    font-size: 11px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 0.1em;
    margin-top: 6px;
  }
  .pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    width: 640px;
  }
  .pill {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 14px;
    padding: 6px 14px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.85);
  }
  .pill:active { background: rgba(255, 255, 255, 0.2); }
  .overlay-logo {
    width: 96px; height: 96px;
    background: linear-gradient(135deg, #9147ff 0%, #6441a5 100%);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    font-weight: 800;
    color: #fff;
  }
  .status {
    font-size: 18px;
    color: rgba(255, 255, 255, 0.85);
  }
  .status-sub {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.5);
  }

  /* Stream-metadata block populated by the LiveStreamInfo GQL call.
     Visible only on the loading overlay; once the video starts the
     compositor surface paints over the DOM and hides everything. */
  .meta-title {
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    max-width: 760px;
    text-align: center;
    line-height: 1.35;
    margin-top: 6px;
  }
  .meta-row {
    display: flex;
    gap: 10px;
    align-items: center;
    color: rgba(255, 255, 255, 0.7);
    font-size: 14px;
  }
  .meta-dot {
    width: 9px;
    height: 9px;
    border-radius: 5px;
    background: #ed4245;
  }
  .meta-game {
    color: #fff;
    font-weight: 500;
  }
  .meta-sep {
    opacity: 0.45;
  }
  .error-chip {
    margin-top: 4px;
    background: rgba(255, 90, 90, 0.18);
    border: 1px solid rgba(255, 90, 90, 0.4);
    color: #ffd5d5;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    max-width: 640px;
    text-align: center;
  }
  .hint {
    margin-top: 8px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.35);
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="stage">
  <video id="player" class="player"></video>
</div>

<div id="overlay" class="overlay">
  <div class="overlay-inner">
    <div class="overlay-logo">Tw</div>

    <!-- ===== input view: app launch / channel picker ===== -->
    <div id="input-view" class="input-view">
      <div class="heading">Twitch</div>
      <div class="input-row">
        <span class="prefix">twitch.tv/</span>
        <input id="channel-input" type="text" placeholder="channel name" />
      </div>
      <div id="watch-btn" class="watch-btn">Watch</div>
      <div id="recents-section" class="hidden">
        <div class="section-title">Recent</div>
        <div id="recents-row" class="pill-row"></div>
      </div>
    </div>

    <!-- ===== loading view: shown after a channel is picked ===== -->
    <div id="loading-view" class="loading-view hidden">
      <div id="status" class="status">Connecting to Twitch…</div>
      <div id="status-sub" class="status-sub">…</div>
      <div id="meta-title" class="meta-title hidden"></div>
      <div id="meta-row" class="meta-row hidden">
        <span class="meta-dot"></span>
        <span id="meta-game" class="meta-game"></span>
        <span id="meta-game-sep" class="meta-sep hidden">·</span>
        <span id="meta-viewers"></span>
        <span id="meta-uptime-sep" class="meta-sep hidden">·</span>
        <span id="meta-uptime"></span>
      </div>
    </div>

    <div id="error-chip" class="error-chip hidden"></div>
    <div class="hint">Tap the field to type a channel · Press B to exit</div>
  </div>
</div>

<!-- ============================================================
     Slice 1 — bare playback of a hardcoded Twitch channel.

     Flow:
       1. POST gql.twitch.tv/gql with the public web-player client-id,
          operation PlaybackAccessToken (persisted-query hash) — get
          back { signature, value }.
       2. Build https://usher.ttvnw.net/api/channel/hls/<login>.m3u8
          with those params; this is the master HLS playlist URL.
       3. Set it as the <video> src; libavformat's HLS demuxer (built
          in via switch-ffmpeg --enable-demuxer=hls) does the rest —
          variant selection, segment fetch, live playlist refresh.

     What's intentionally NOT in this slice: channel input, quality
     switcher, viewer count / metadata, chat, retry on token expiry.
     ============================================================ -->
<script>
  // ---------- config ----------
  // assets/config.json overrides channel + variant default at runtime.
  // Defaults below apply if the file is missing or unparseable.
  const CONFIG_URL = 'browser://apps/twitch/assets/config.json';
  const DEFAULT_CHANNEL = 'dino_xx';
  const DEFAULT_QUALITY = 'auto';

  const CLIENT_ID = 'kimne78kx3ncx6brgo4mv6wki5h1ko'; // public web player
  // PlaybackAccessToken persisted-query hash. Stable for years; if it
  // ever rotates, fall back to sending the full query body.
  const PAT_HASH = '0828119ded1c13477966434e15800ff57ddacf13ba1911c129dc2200705b0712';
  const DESKTOP_UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
    'AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36';
  const LOG_PATH = 'sdmc:/switch/webprofiles/default/logs/twitch-app.log';
  const RECENTS_PATH = 'sdmc:/switch/webprofiles/default/twitch-recent.json';
  const RECENTS_MAX = 12;
  const APP_VERSION = 'slice2-input-bg-fix';

  // ---------- el refs ----------
  const playerEl = document.getElementById('player');
  const overlayEl = document.getElementById('overlay');
  const inputViewEl = document.getElementById('input-view');
  const loadingViewEl = document.getElementById('loading-view');
  const channelInputEl = document.getElementById('channel-input');
  const watchBtnEl = document.getElementById('watch-btn');
  const recentsSectionEl = document.getElementById('recents-section');
  const recentsRowEl = document.getElementById('recents-row');
  const statusEl = document.getElementById('status');
  const errorChip = document.getElementById('error-chip');

  let recents = []; // array of channel logins, LRU order
  let appConfig = null; // populated by loadConfig at boot

  function log(msg) {
    console.debug('[twitch-app]', msg);
    try {
      const sw = globalThis.Switch;
      if (sw && typeof sw.appendFileSync === 'function') {
        const ts = new Date().toISOString().replace('T', ' ').slice(0, 23);
        sw.appendFileSync(LOG_PATH, '[' + ts + '] ' + msg + '\n');
      }
    } catch (_e) { /* file log is best effort */ }
  }

  function setStatus(s) {
    statusEl.textContent = s;
    log('status: ' + s);
  }

  // Show an error and put the overlay back into input-view so the user
  // can recover (pick another channel) without B-back-reopening.
  function showError(msg) {
    overlayEl.classList.remove('hidden');
    loadingViewEl.classList.add('hidden');
    inputViewEl.classList.remove('hidden');
    errorChip.classList.remove('hidden');
    errorChip.textContent = msg;
    log('ERROR ' + msg);
  }

  // Anonymous public-data GQL — title, viewer count, game, uptime.
  // Single roundtrip; sent as a literal query (not persisted-query
  // hash) so we don't depend on a hash we can't independently verify.
  // Twitch accepts this from the public client-id for live channels.
  async function fetchStreamMetadata(channel) {
    const query =
      'query LiveStreamInfo($login: String!) {' +
      '  user(login: $login) {' +
      '    id displayName' +
      '    stream {' +
      '      id title viewersCount createdAt' +
      '      game { id displayName }' +
      '    }' +
      '  }' +
      '}';
    log('POST gql.twitch.tv/gql (LiveStreamInfo ' + channel + ')');
    const resp = await fetch('https://gql.twitch.tv/gql', {
      method: 'POST',
      headers: {
        'Client-ID': CLIENT_ID,
        'Content-Type': 'application/json',
        'user-agent': DESKTOP_UA,
      },
      body: JSON.stringify({ query: query, variables: { login: channel } }),
    });
    log('  meta gql status ' + resp.status);
    if (!resp.ok) throw new Error('Meta GQL HTTP ' + resp.status);
    const json = await resp.json();
    const user = json && json.data && json.data.user;
    if (!user) throw new Error('No user in metadata response');
    const stream = user.stream;
    return {
      displayName: user.displayName || channel,
      title: stream && stream.title ? stream.title : null,
      viewersCount: stream && typeof stream.viewersCount === 'number'
        ? stream.viewersCount : null,
      createdAt: stream && stream.createdAt ? stream.createdAt : null,
      gameDisplayName: stream && stream.game ? stream.game.displayName : null,
    };
  }

  // Compact viewer count: 999, 1.2K, 35.1K, 158K, 1.2M.
  function formatCount(n) {
    if (n == null || typeof n !== 'number' || !isFinite(n)) return '';
    const abs = Math.abs(n);
    if (abs < 1000) return String(n | 0);
    if (abs < 10000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
    if (abs < 1000000) return Math.round(n / 1000) + 'K';
    if (abs < 10000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    return Math.round(n / 1000000) + 'M';
  }

  // "5h 12m", "47m". Returns '' for missing / invalid timestamps.
  function formatUptime(isoString) {
    if (!isoString) return '';
    const t = Date.parse(isoString);
    if (isNaN(t)) return '';
    const ms = Date.now() - t;
    if (ms < 0) return '';
    const mins = Math.floor(ms / 60000);
    if (mins < 60) return mins + 'm';
    const hrs = Math.floor(mins / 60);
    return hrs + 'h ' + (mins % 60) + 'm';
  }

  function populateMetadata(meta) {
    log('  meta: ' + meta.displayName +
        ' · "' + (meta.title || '(no title)') + '"' +
        ' · ' + (meta.viewersCount != null ? meta.viewersCount + ' viewers' : '?') +
        ' · ' + (meta.gameDisplayName || '(no game)'));

    // Real display name has correct casing (e.g. "Dino_xx" vs login "dino_xx").
    document.getElementById('status-sub').textContent = meta.displayName;

    if (meta.title) {
      const t = document.getElementById('meta-title');
      t.textContent = meta.title;
      t.classList.remove('hidden');
    }

    const gameEl = document.getElementById('meta-game');
    const gameSepEl = document.getElementById('meta-game-sep');
    const viewersEl = document.getElementById('meta-viewers');
    const uptimeSepEl = document.getElementById('meta-uptime-sep');
    const uptimeEl = document.getElementById('meta-uptime');

    if (meta.gameDisplayName) {
      gameEl.textContent = meta.gameDisplayName;
      gameSepEl.classList.remove('hidden');
    }
    if (meta.viewersCount != null) {
      viewersEl.textContent = formatCount(meta.viewersCount) + ' viewers';
    }
    const uptimeStr = formatUptime(meta.createdAt);
    if (uptimeStr) {
      uptimeSepEl.classList.remove('hidden');
      uptimeEl.textContent = 'live ' + uptimeStr;
    }

    if (meta.gameDisplayName || meta.viewersCount != null || uptimeStr) {
      document.getElementById('meta-row').classList.remove('hidden');
    }
  }

  async function fetchAccessToken(channel) {
    const body = {
      operationName: 'PlaybackAccessToken',
      extensions: { persistedQuery: { version: 1, sha256Hash: PAT_HASH } },
      variables: { isLive: true, login: channel, isVod: false, vodID: '', playerType: 'site' },
    };
    log('POST https://gql.twitch.tv/gql (PlaybackAccessToken ' + channel + ')');
    const resp = await fetch('https://gql.twitch.tv/gql', {
      method: 'POST',
      headers: {
        'Client-ID': CLIENT_ID,
        'Content-Type': 'application/json',
        'user-agent': DESKTOP_UA,
      },
      body: JSON.stringify(body),
    });
    log('  gql status ' + resp.status);
    if (!resp.ok) throw new Error('GQL HTTP ' + resp.status);
    const json = await resp.json();
    const tok = json && json.data && json.data.streamPlaybackAccessToken;
    if (!tok || !tok.value || !tok.signature) {
      throw new Error('Channel offline or unknown: ' + channel);
    }
    log('  token ok sig=' + tok.signature.slice(0, 8) + '… value chars=' + tok.value.length);
    return tok;
  }

  // Load config from assets/config.json. Defensive: any failure
  // (missing file, bad JSON, fetch error) returns the built-in
  // defaults so the app still boots. Logs the resolved values.
  async function loadConfig() {
    let channel = DEFAULT_CHANNEL;
    let quality = DEFAULT_QUALITY;
    try {
      log('GET ' + CONFIG_URL);
      const resp = await fetch(CONFIG_URL);
      log('  config status ' + resp.status);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const cfg = await resp.json();
      if (cfg && typeof cfg.defaultChannel === 'string' && cfg.defaultChannel) {
        channel = cfg.defaultChannel;
      }
      if (cfg && typeof cfg.quality === 'string' && cfg.quality) {
        quality = cfg.quality;
      }
    } catch (err) {
      log('  config load failed (' +
          (err && err.message ? err.message : err) +
          '); falling back to built-in defaults');
    }
    log('  config: channel=' + channel + ' quality=' + quality);
    return { channel: channel, quality: quality };
  }

  // Parse a Twitch-style quality string like "480p30" into {height, fps}.
  // Returns null for unrecognised strings ("source", "auto", typos).
  function parseQualitySpec(spec) {
    if (!spec || typeof spec !== 'string') return null;
    const m = spec.match(/^(\d+)p(\d+)$/);
    if (!m) return null;
    return { height: parseInt(m[1], 10), fps: parseInt(m[2], 10) };
  }

  // Pre-fetch the master playlist and pick a variant ourselves.
  // Handing the master URL straight to <video> lets FFmpeg's HLS
  // demuxer auto-pick the source (1080p60 ~4.2 Mbps), which on real
  // hardware decodes choppy because the NVTEGRA HW decoder stalls
  // after frame 0 (memory: project-swb-tiktok-demo) and the SW
  // fallback can't keep up at 60fps.
  //
  // Quality string semantics (from assets/config.json):
  //   "source"   → highest bandwidth, any fps
  //   "auto"     → highest-bandwidth variant with fps <= 30 (safe default)
  //   "480p30"   → exact match by RESOLUTION height + FRAME-RATE;
  //                if the channel doesn't expose it, fall back to "auto"
  //
  // The selected variant URL is itself signed + live-refreshing — the
  // HLS demuxer happily streams segments from it without ever needing
  // to see the master again.
  async function pickVariant(masterUrl, quality) {
    log('GET master m3u8…');
    const resp = await fetch(masterUrl);
    log('  master status ' + resp.status);
    if (!resp.ok) throw new Error('Master HTTP ' + resp.status);
    const body = await resp.text();
    log('  master bytes=' + body.length);

    const lines = body.split('\n');
    const variants = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line.startsWith('#EXT-X-STREAM-INF:')) continue;
      const attrs = line.slice('#EXT-X-STREAM-INF:'.length);
      const bwM = attrs.match(/BANDWIDTH=(\d+)/);
      const resM = attrs.match(/RESOLUTION=(\d+x\d+)/);
      const codM = attrs.match(/CODECS="([^"]+)"/);
      const frM = attrs.match(/FRAME-RATE=([\d.]+)/);
      // URL is the next non-blank, non-comment line.
      let url = null;
      for (let j = i + 1; j < lines.length; j++) {
        const next = lines[j].trim();
        if (!next || next.charAt(0) === '#') continue;
        url = next;
        break;
      }
      if (!url) continue;
      const codecs = codM ? codM[1] : '';
      // Skip audio-only variants (no H.264 video codec).
      if (codecs && codecs.indexOf('avc1') === -1) continue;
      variants.push({
        bandwidth: bwM ? parseInt(bwM[1], 10) : 0,
        resolution: resM ? resM[1] : '?',
        frameRate: frM ? parseFloat(frM[1]) : null,
        codecs: codecs,
        url: url,
      });
    }
    if (variants.length === 0) {
      throw new Error('No video variants in master playlist');
    }
    variants.sort(function (a, b) { return a.bandwidth - b.bandwidth; });
    for (const v of variants) {
      log('  variant: bw=' + v.bandwidth +
          ' res=' + v.resolution +
          ' fps=' + (v.frameRate == null ? '?' : v.frameRate) +
          ' codecs=' + v.codecs);
    }

    const policy = (quality || DEFAULT_QUALITY).toLowerCase();
    let picked = null;
    let pickReason = '';

    if (policy === 'source') {
      picked = variants[variants.length - 1];
      pickReason = 'source (highest bandwidth)';
    } else {
      // Try to interpret the spec as an exact "<height>p<fps>" target.
      const spec = parseQualitySpec(policy);
      if (spec) {
        for (const v of variants) {
          const h = v.resolution.split('x')[1];
          if (h && parseInt(h, 10) === spec.height &&
              v.frameRate != null &&
              Math.abs(v.frameRate - spec.fps) < 1.0) {
            picked = v;
            pickReason = 'exact match for ' + policy;
            break;
          }
        }
        if (!picked) {
          log('  config quality "' + policy +
              '" not in master playlist; falling back to auto');
        }
      } else if (policy !== 'auto') {
        log('  unrecognised quality "' + policy + '"; falling back to auto');
      }
    }

    // "auto" — and the fallback path for unrecognised / unmet specs:
    // highest-bandwidth variant with fps <= 30. Variants without
    // FRAME-RATE info are treated as "unknown high" and skipped.
    if (!picked) {
      for (let i = variants.length - 1; i >= 0; i--) {
        const v = variants[i];
        if (v.frameRate != null && v.frameRate <= 30.5) {
          picked = v;
          pickReason = 'auto (highest <=30fps)';
          break;
        }
      }
    }
    if (!picked) {
      picked = variants[0];
      pickReason = 'fallback to lowest (no <=30fps variant)';
    }
    log('  picked: ' + picked.resolution +
        ' @ ' + picked.bandwidth + ' bps fps=' + picked.frameRate +
        ' [' + pickReason + ']');
    return picked;
  }

  function buildUsherUrl(channel, tok) {
    const p = new URLSearchParams({
      allow_source: 'true',
      fast_bread: 'true',
      player_backend: 'mediaplayer',
      playlist_include_framerate: 'true',
      reassignments_supported: 'true',
      sig: tok.signature,
      token: tok.value,
      cdm: 'wv',
      player_version: '1.30.0',
      p: String(Math.floor(Math.random() * 1e6)),
    });
    return 'https://usher.ttvnw.net/api/channel/hls/' +
      encodeURIComponent(channel) + '.m3u8?' + p.toString();
  }

  // ---------- recents (LRU of last-watched channels) ----------
  function readRecents() {
    try {
      const sw = globalThis.Switch;
      if (!sw || typeof sw.readFileSync !== 'function') return [];
      const buf = sw.readFileSync(RECENTS_PATH);
      if (!buf) return [];
      const txt = typeof buf === 'string' ? buf
        : new TextDecoder('utf-8').decode(buf);
      const parsed = JSON.parse(txt);
      if (!Array.isArray(parsed)) return [];
      return parsed.filter(function (s) {
        return typeof s === 'string' && s.length > 0;
      }).slice(0, RECENTS_MAX);
    } catch (_e) {
      return [];
    }
  }

  function writeRecents() {
    try {
      const sw = globalThis.Switch;
      if (!sw || typeof sw.writeFileSync !== 'function') return;
      sw.writeFileSync(RECENTS_PATH, JSON.stringify(recents));
    } catch (err) {
      log('  recents write failed: ' +
          (err && err.message ? err.message : err));
    }
  }

  function pushRecent(channel) {
    const norm = channel.toLowerCase();
    const idx = recents.findIndex(function (c) {
      return c.toLowerCase() === norm;
    });
    if (idx >= 0) recents.splice(idx, 1);
    recents.unshift(channel);
    if (recents.length > RECENTS_MAX) recents = recents.slice(0, RECENTS_MAX);
    writeRecents();
  }

  function renderRecents() {
    recentsRowEl.innerHTML = '';
    if (recents.length === 0) {
      recentsSectionEl.classList.add('hidden');
      return;
    }
    recentsSectionEl.classList.remove('hidden');
    for (const ch of recents) {
      const pill = document.createElement('div');
      pill.className = 'pill';
      pill.textContent = ch;
      pill.addEventListener('click', function () {
        log('recent pill tapped: ' + ch);
        setChannelInput(ch);
        selectChannel(ch);
      });
      recentsRowEl.appendChild(pill);
    }
  }

  // Update the channel input element. The live-DOM painter reads
  // .value (the property) for the rendered text, but the QWERTY
  // overlay reads the `value` attribute when opening — so we set
  // both. (Sibling to memory live-dom-attr-reflection: not all attrs
  // and props are kept in sync.)
  function setChannelInput(value) {
    channelInputEl.setAttribute('value', value);
    channelInputEl.value = value;
  }

  // Sanitize input: lowercase, trim, drop anything that's not a
  // Twitch-legal login char [a-z0-9_]. Twitch will reject anything
  // weird at the GQL layer anyway but this prevents obvious typos.
  function sanitizeChannel(s) {
    if (!s) return '';
    return String(s).toLowerCase().trim().replace(/[^a-z0-9_]/g, '');
  }

  // User has picked a channel — swap the overlay from input-view to
  // loading-view, record the choice, and kick off the playback flow.
  function selectChannel(rawChannel) {
    const channel = sanitizeChannel(rawChannel);
    if (!channel) {
      log('selectChannel: empty channel after sanitise; ignoring');
      return;
    }
    log('selectChannel: ' + channel);
    pushRecent(channel);
    // Clear any lingering error from a previous attempt.
    errorChip.classList.add('hidden');
    errorChip.textContent = '';
    inputViewEl.classList.add('hidden');
    loadingViewEl.classList.remove('hidden');
    document.getElementById('status-sub').textContent = channel;
    start(channel);
  }

  async function start(channel) {
    try {

      // Fire-and-forget metadata fetch. It runs in parallel with the
      // playback chain and populates the overlay whenever it resolves;
      // playback never blocks on it. Failures are non-fatal — the
      // user just sees the channel name without enrichment.
      fetchStreamMetadata(channel)
        .then(populateMetadata)
        .catch(function (e) {
          log('  meta fetch FAILED: ' +
              (e && e.message ? e.message : e));
        });

      setStatus('Requesting access token…');
      const tok = await fetchAccessToken(channel);

      const masterUrl = buildUsherUrl(channel, tok);
      log('master URL chars=' + masterUrl.length);

      setStatus('Picking quality…');
      const variant = await pickVariant(
        masterUrl, appConfig ? appConfig.quality : null);

      setStatus('Tuning in… ' + variant.resolution);

      // Hide the overlay BEFORE the video gets a src. Once the
      // compositor starts painting the video surface, any DOM element
      // covering the video region will have the video painted on top
      // of it (memory: video-paints-over-dom). The overlay would be
      // invisible anyway, so just remove it from layout.
      overlayEl.classList.add('hidden');

      playerEl.setAttribute('src', variant.url);
      if (typeof playerEl.load === 'function') playerEl.load();
      try {
        if (typeof playerEl.play === 'function') playerEl.play();
      } catch (e) {
        log('play() threw: ' + (e && e.message ? e.message : e));
      }
      log('handed URL to <video>; libavformat HLS demuxer takes over');
    } catch (err) {
      let msg = (err && err.message) ? err.message : String(err);
      // Common case: usher returns 404 when the channel has no live
      // stream right now. The PlaybackAccessToken endpoint still issues
      // a token even for offline channels, so we don't catch this
      // earlier. Rewrite to a user-friendly message.
      if (/Master HTTP 404/i.test(msg)) {
        msg = channel + ' is offline (no live stream right now)';
      }
      showError(msg);
    }
  }

  // ---------- boot ----------
  async function boot() {
    log('--- twitch-app ' + APP_VERSION + ' boot ' +
        new Date().toISOString() + ' ---');

    appConfig = await loadConfig();
    recents = readRecents();
    log('  recents loaded: ' + recents.length + ' channels');

    // Pre-fill the channel input with the most recent watched channel,
    // falling back to the config.defaultChannel.
    const preselect = (recents.length > 0) ? recents[0] : appConfig.channel;
    setChannelInput(preselect);

    renderRecents();

    // QWERTY Submit fires a `change` event on the input (see
    // memory tiktok app slice 4: live-form fireEvent: input/change/blur).
    channelInputEl.addEventListener('change', function () {
      const val = (channelInputEl.value || '').trim();
      if (val) selectChannel(val);
    });

    watchBtnEl.addEventListener('click', function () {
      const val = (channelInputEl.value || '').trim();
      if (val) selectChannel(val);
    });

    log('  boot complete; awaiting channel pick (preselect=' + preselect + ')');
  }

  boot().catch(function (err) {
    log('boot FAILED: ' + (err && err.message ? err.message : err));
  });
</script>

</body>
</html>
