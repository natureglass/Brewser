<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>itch.io</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #222129;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  /* Layout: sidebar (left, feed pills) + stage (right, list ↔ detail). */
  .layout {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
  }

  /* ---------- sidebar ---------- */
  .sidebar {
    width: 220px;
    height: 100%;
    background: #1a1820;
    border-right: 1px solid rgba(255, 255, 255, 0.06);
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 4px 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    margin-bottom: 6px;
  }
  .brand-logo {
    width: 40px;
    height: 40px;
    border-radius: 8px;
  }
  .brand-title {
    font-size: 18px;
    font-weight: 700;
    color: #fa5c5c;
    letter-spacing: 0.02em;
  }
  .sidebar-label {
    font-size: 11px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 4px 4px 2px;
  }
  .feed-pill {
    padding: 10px 14px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
    color: rgba(255, 255, 255, 0.85);
    font-size: 14px;
    font-weight: 600;
    width: 100%;
    user-select: none;
    outline: none;
  }
  .feed-pill:active { background: rgba(255, 255, 255, 0.12); }
  .feed-pill.selected {
    background: #fa5c5c;
    color: #fff;
  }

  /* ---------- stage ---------- */
  .stage {
    flex: 1;
    height: 100%;
    position: relative;
    background: #222129;
  }

  /* List view — vertical scrollable list of game rows. */
  .list-view {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow-y: auto;
    padding: 12px 16px;
  }
  .list-header {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.55);
    padding: 4px 4px 12px;
    width: 100%;
  }
  .list-status {
    padding: 40px 16px;
    text-align: center;
    color: rgba(255, 255, 255, 0.5);
    font-size: 14px;
    width: 100%;
  }
  .list-status-error {
    color: rgba(255, 180, 180, 0.8);
  }
  .retry-btn {
    display: inline-block;
    margin-top: 14px;
    padding: 8px 18px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 16px;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
  }
  .retry-btn:active { background: rgba(255, 255, 255, 0.18); }

  .game-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 12px;
    background: #2a2832;
    border-radius: 10px;
    margin-bottom: 8px;
    width: 100%;
    min-height: 104px;
    user-select: none;
    outline: none;
  }
  .game-row:active { background: #34323e; }

  /* Thumbnail. Slice 2 populates the <img>; slice 1 shows a placeholder
     gradient so the row has visible structure before images load. */
  .thumb-wrap {
    width: 120px;
    height: 84px;
    border-radius: 6px;
    background: linear-gradient(135deg, #3a2540, #2a3848);
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
  }
  .thumb-img {
    width: 120px;
    height: 84px;
    display: block;
  }

  /* Wrap text content in an explicit-width column ([[swb-flex-column-min-content]]).
     Without this, the column shrinks to longest-word width and titles wrap mid-word. */
  .row-text {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .row-title {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    line-height: 1.3;
    width: 100%;
  }
  .row-meta {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.55);
    width: 100%;
  }
  .row-meta .author { color: rgba(250, 92, 92, 0.85); font-weight: 600; }
  .row-tags {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.45);
    width: 100%;
  }

  .row-price {
    padding: 4px 10px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.3);
    color: rgba(255, 255, 255, 0.8);
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    width: 64px;
    text-align: center;
  }
  .row-price.free { background: rgba(95, 200, 95, 0.18); color: #b6f3b6; }

  /* ---------- detail view ---------- */
  .detail-view {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #222129;
    overflow-y: auto;
    padding: 14px 24px 24px;
  }
  .detail-back {
    display: inline-block;
    padding: 6px 12px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 14px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .detail-back:active { background: rgba(255, 255, 255, 0.16); }
  .detail-hero {
    display: flex;
    align-items: flex-start;
    gap: 18px;
    margin-bottom: 14px;
    width: 100%;
  }
  .detail-thumb-wrap {
    width: 280px;
    height: 222px;
    border-radius: 10px;
    background: linear-gradient(135deg, #3a2540, #2a3848);
    overflow: hidden;
    flex-shrink: 0;
  }
  .detail-thumb {
    width: 280px;
    height: 222px;
    display: block;
  }
  .detail-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .detail-title {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    line-height: 1.25;
    width: 100%;
  }
  .detail-author {
    font-size: 14px;
    color: rgba(250, 92, 92, 0.9);
    font-weight: 600;
    width: 100%;
  }
  .detail-meta {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.55);
    width: 100%;
  }
  .play-row {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
  }
  /* The Play action is a real <a href> so the shell's tap → navigateTo
     pipeline picks it up via `kind: 'navigate'` ([[reference-swb-back-button-page-intercept]]
     adjacent — anchor handling is in live-overlay.ts). */
  .play-btn {
    display: inline-block;
    padding: 12px 28px;
    background: #fa5c5c;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    border-radius: 10px;
    text-decoration: none;
    user-select: none;
  }
  .play-btn:active { background: #d44545; }
  .play-hint {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
    flex: 1;
  }
  .detail-section-label {
    font-size: 11px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 18px 0 6px;
    width: 100%;
  }
  .detail-desc {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.8);
    line-height: 1.5;
    width: 100%;
  }
  .detail-url {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
    word-break: break-all;
    width: 100%;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="layout" class="layout">

  <!-- ============================== SIDEBAR ============================== -->
  <aside id="sidebar" class="sidebar">
    <div class="brand-row">
      <img class="brand-logo" src="assets/itchio_logo.png" alt="itch.io" />
      <div class="brand-title">itch.io</div>
    </div>
    <div class="sidebar-label">Browse</div>
    <div id="feed-pills"></div>
  </aside>

  <!-- ============================== STAGE ============================== -->
  <main id="stage" class="stage">

    <!-- List view (default) -->
    <div id="list-view" class="list-view">
      <div id="list-header" class="list-header"></div>
      <div id="list-status" class="list-status">Loading games…</div>
      <div id="list-items"></div>
    </div>

    <!-- Detail view (shown when a card is tapped) -->
    <div id="detail-view" class="detail-view hidden">
      <div id="detail-back" class="detail-back">← Back</div>
      <div class="detail-hero">
        <div class="detail-thumb-wrap">
          <img id="detail-thumb" class="detail-thumb" />
        </div>
        <div class="detail-info">
          <div id="detail-title" class="detail-title"></div>
          <div id="detail-author" class="detail-author"></div>
          <div id="detail-meta" class="detail-meta"></div>
          <div class="play-row">
            <a id="play-btn" class="play-btn" href="#">Play</a>
            <div class="play-hint">opens the test game URL (slice 3 stub)</div>
          </div>
        </div>
      </div>
      <div class="detail-section-label">About</div>
      <div id="detail-desc" class="detail-desc"></div>
      <div class="detail-section-label">Source URL</div>
      <div id="detail-url" class="detail-url"></div>
    </div>

  </main>

</div>

<script>
  // ---------- config ----------
  const APP_VERSION = 'slice1-2-3-scaffold';
  const CONFIG_URL = 'brewser://apps/itchio/assets/config.json';
  const LOG_PATH = 'sdmc:/switch/brewser/logs/itchio-app.log';
  const DESKTOP_UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
    'AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36';

  const FEEDS = {
    newest: {
      label: 'Newest',
      url: 'https://itch.io/games/platform-web/newest.xml',
      header: 'Latest browser-playable games on itch.io',
    },
    top: {
      label: 'Top Rated',
      url: 'https://itch.io/games/platform-web/top-rated.xml',
      header: 'Highest-rated browser-playable games on itch.io',
    },
  };
  const DEFAULT_FEED = 'newest';
  const DEFAULT_TEST_GAME_URL =
    'https://html-classic.itch.zone/html/17770195/web/index.html?v=1780340301';

  // ---------- state ----------
  let appConfig = { feed: DEFAULT_FEED, testGameUrl: DEFAULT_TEST_GAME_URL };
  let currentFeed = DEFAULT_FEED;
  let items = [];
  let view = 'list';
  let detailItem = null;

  // ---------- el refs ----------
  const feedPillsEl = document.getElementById('feed-pills');
  const listViewEl = document.getElementById('list-view');
  const listHeaderEl = document.getElementById('list-header');
  const listStatusEl = document.getElementById('list-status');
  const listItemsEl = document.getElementById('list-items');
  const detailViewEl = document.getElementById('detail-view');
  const detailBackEl = document.getElementById('detail-back');
  const detailThumbEl = document.getElementById('detail-thumb');
  const detailTitleEl = document.getElementById('detail-title');
  const detailAuthorEl = document.getElementById('detail-author');
  const detailMetaEl = document.getElementById('detail-meta');
  const detailDescEl = document.getElementById('detail-desc');
  const detailUrlEl = document.getElementById('detail-url');
  const playBtnEl = document.getElementById('play-btn');

  // ---------- log ----------
  function log(msg) {
    console.debug('[itchio-app]', msg);
    try {
      const sw = globalThis.Switch;
      if (sw && typeof sw.appendFileSync === 'function') {
        const ts = new Date().toISOString().replace('T', ' ').slice(0, 23);
        sw.appendFileSync(LOG_PATH, '[' + ts + '] ' + msg + '\n');
      }
    } catch (_e) { /* best effort */ }
  }

  // ---------- config load ----------
  async function loadConfig() {
    let cfg = { feed: DEFAULT_FEED, testGameUrl: DEFAULT_TEST_GAME_URL };
    try {
      log('GET ' + CONFIG_URL);
      const resp = await fetch(CONFIG_URL);
      log('  config status ' + resp.status);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      if (json && typeof json.feed === 'string' && FEEDS[json.feed]) {
        cfg.feed = json.feed;
      }
      if (json && typeof json.testGameUrl === 'string' && json.testGameUrl) {
        cfg.testGameUrl = json.testGameUrl;
      }
    } catch (err) {
      log('  config load failed (' +
          (err && err.message ? err.message : err) +
          '); using defaults');
    }
    log('  config: feed=' + cfg.feed + ' testGameUrl=' + cfg.testGameUrl);
    return cfg;
  }

  // Note: an earlier iteration tried setTimeout- and rAF-based paint
  // heartbeats to force the post-renderList view to appear without a
  // user tap. Both fired correctly (logs confirm) and both did the right
  // engine mutations (appendChild on body → markLiveDirty + bumpTreeVersion
  // + requestFullRepaint), but neither resulted in a visible screen
  // update. The screen only updates on a touch event arriving via the
  // engine's native dispatchTouchEvents path. Workarounds removed —
  // this is an engine-side paint-loop wakeup issue. See README/memory.

  // ---------- thumbnail loader (staggered) ----------
  // Firing 36 <img src> setAttribute calls synchronously in renderList
  // creates 36 parallel TCP connects to img.itch.zone. The Switch's TCP
  // pool is small (~16 slots); past that, `connect` rejects. nx.js's
  // Socket constructor exposes `socket.opened` as a Promise BEFORE any
  // consumer (the readable/writable streams' pull/write callbacks) has
  // had a chance to attach .then/.catch — so a fast connect rejection
  // becomes an unhandled promise rejection and `console.error`-style
  // fatal flips the canvas to "Press + to exit" mode.
  //
  // Mitigation: serialize the thumbnail loads with a per-tick stagger.
  // 250 ms between assignments keeps the active socket count low (the
  // decode + close usually finishes before the next connect fires), and
  // a stale-token gate lets us cancel the in-flight queue when the user
  // switches feeds or navigates away so we don't keep loading thumbs
  // for a list the user can no longer see.
  const THUMB_STAGGER_MS = 250;
  let _thumbQueue = [];
  let _thumbPumping = false;
  let _thumbToken = 0;
  function enqueueThumb(imgEl, src, token) {
    _thumbQueue.push({ imgEl: imgEl, src: src, token: token });
    if (!_thumbPumping) pumpThumbQueue();
  }
  function pumpThumbQueue() {
    _thumbPumping = true;
    while (_thumbQueue.length > 0 && _thumbQueue[0].token !== _thumbToken) {
      _thumbQueue.shift(); // drop stale (feed switch / navigation)
    }
    const next = _thumbQueue.shift();
    if (!next) { _thumbPumping = false; return; }
    try {
      next.imgEl.setAttribute('src', next.src);
    } catch (e) {
      log('thumb setAttribute threw: ' +
          (e && e.message ? e.message : e));
    }
    setTimeout(pumpThumbQueue, THUMB_STAGGER_MS);
  }
  function invalidateThumbQueue() {
    _thumbToken = (_thumbToken + 1) >>> 0;
  }
  // Guard against formats / paths the engine can't decode reliably.
  // GIFs: the engine's gif decoder fails on a non-trivial fraction of
  // itch.io's animated thumbs and the error path leaks (see renderList
  // comment). Until the engine fix lands, skip them — placeholder
  // gradient shows in their slot.
  function isUnsafeThumbnailUrl(url) {
    if (!url || typeof url !== 'string') return true;
    if (/\.gif(\?|$)/i.test(url)) return true;
    return false;
  }

  // ---------- entity decode (RSS uses &#039; etc) ----------
  function decodeEntities(s) {
    if (!s) return '';
    return String(s)
      .replace(/&lt;/g, '<')
      .replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"')
      .replace(/&#(\d+);/g, function (_, d) {
        return String.fromCharCode(parseInt(d, 10));
      })
      .replace(/&#x([0-9a-fA-F]+);/g, function (_, h) {
        return String.fromCharCode(parseInt(h, 16));
      })
      .replace(/&amp;/g, '&');
  }

  // ---------- RSS parse ----------
  // No DOMParser in the runtime — regex-based extraction works for the
  // itch.io feed shape (verified via probe-itchio.mjs).
  function parseRssFeed(xml) {
    const out = [];
    if (!xml) return out;
    const itemRe = /<item>([\s\S]*?)<\/item>/g;
    let m;
    while ((m = itemRe.exec(xml)) !== null) {
      const block = m[1];
      const tagText = function (tag) {
        const re = new RegExp('<' + tag + '>([\\s\\S]*?)</' + tag + '>');
        const mm = block.match(re);
        if (!mm) return '';
        let inner = mm[1];
        // Strip CDATA wrappers.
        const cdataM = inner.match(/^<!\[CDATA\[([\s\S]*?)\]\]>$/);
        if (cdataM) inner = cdataM[1];
        return inner.trim();
      };
      const plainTitle = decodeEntities(tagText('plainTitle'));
      const titleFull = decodeEntities(tagText('title'));
      const link = tagText('link');
      const imageurl = tagText('imageurl');
      const price = tagText('price');
      const currency = tagText('currency');
      const pubDate = tagText('pubDate');
      const description = decodeEntities(tagText('description'))
        // Strip the trailing thumbnail <img ...> the RSS embeds in description.
        .replace(/<img[^>]*\/?>/gi, '')
        .trim();
      // Extract bracketed tags from the title (e.g. "[Free] [Action]").
      const tags = [];
      const tagRe = /\[([^\]]+)\]/g;
      let tm;
      while ((tm = tagRe.exec(titleFull)) !== null) {
        const t = tm[1].trim();
        if (t && t.toLowerCase() !== 'free') tags.push(t);
      }
      // Derive author from the project URL: https://<author>.itch.io/<slug>
      let author = '';
      const authM = link.match(/^https?:\/\/([^.]+)\.itch\.io\//i);
      if (authM) author = authM[1];

      out.push({
        title: plainTitle || titleFull,
        titleFull: titleFull,
        link: link,
        imageurl: imageurl,
        price: price,
        currency: currency,
        pubDate: pubDate,
        description: description,
        tags: tags,
        author: author,
      });
    }
    return out;
  }

  // ---------- fetch feed ----------
  async function fetchFeed(feedKey) {
    const def = FEEDS[feedKey];
    if (!def) throw new Error('Unknown feed: ' + feedKey);
    log('GET ' + def.url);
    // Desktop UA so itch.io serves the same response Node/PowerShell sees
    // ([[reference-nxjs-fetch-default-ua]]).
    const resp = await fetch(def.url, {
      headers: { 'user-agent': DESKTOP_UA },
    });
    log('  feed status ' + resp.status);
    if (!resp.ok) throw new Error('Feed HTTP ' + resp.status);
    const xml = await resp.text();
    log('  feed bytes=' + xml.length);
    const parsed = parseRssFeed(xml);
    log('  parsed ' + parsed.length + ' items');
    return parsed;
  }

  // ---------- sidebar render ----------
  function renderSidebar() {
    feedPillsEl.innerHTML = '';
    for (const key of Object.keys(FEEDS)) {
      const pill = document.createElement('div');
      pill.className = 'feed-pill' + (key === currentFeed ? ' selected' : '');
      pill.textContent = FEEDS[key].label;
      pill._feedKey = key;
      pill.addEventListener('click', function () {
        if (currentFeed === key) return;
        log('feed pill tapped: ' + key);
        currentFeed = key;
        renderSidebar();
        loadFeed(key);
      });
      feedPillsEl.appendChild(pill);
    }
  }

  // ---------- list render ----------
  function setListStatus(state, msg) {
    if (state === 'hidden') {
      listStatusEl.classList.add('hidden');
      return;
    }
    listStatusEl.classList.remove('hidden');
    listStatusEl.innerHTML = '';
    if (state === 'loading') {
      listStatusEl.className = 'list-status';
      listStatusEl.textContent = msg || 'Loading games…';
      return;
    }
    listStatusEl.className = 'list-status list-status-error';
    const text = document.createElement('div');
    text.textContent = msg || 'Couldn\'t load games';
    listStatusEl.appendChild(text);
    const btn = document.createElement('div');
    btn.className = 'retry-btn';
    btn.textContent = 'Retry';
    btn.addEventListener('click', function () { loadFeed(currentFeed); });
    listStatusEl.appendChild(btn);
  }

  function buildRow(item, idx) {
    const row = document.createElement('div');
    row.className = 'game-row';
    row._itemIdx = idx;

    const thumbWrap = document.createElement('div');
    thumbWrap.className = 'thumb-wrap';
    if (item.imageurl && !isUnsafeThumbnailUrl(item.imageurl)) {
      const img = document.createElement('img');
      img.className = 'thumb-img';
      thumbWrap.appendChild(img);
      enqueueThumb(img, item.imageurl, _thumbToken);
    }
    row.appendChild(thumbWrap);

    const text = document.createElement('div');
    text.className = 'row-text';

    const title = document.createElement('div');
    title.className = 'row-title';
    title.textContent = item.title;
    text.appendChild(title);

    const meta = document.createElement('div');
    meta.className = 'row-meta';
    if (item.author) {
      const a = document.createElement('span');
      a.className = 'author';
      a.textContent = 'by ' + item.author;
      meta.appendChild(a);
    }
    text.appendChild(meta);

    if (item.tags.length > 0) {
      const tags = document.createElement('div');
      tags.className = 'row-tags';
      tags.textContent = item.tags.join(' · ');
      text.appendChild(tags);
    }

    row.appendChild(text);

    const price = document.createElement('div');
    const isFree = !item.price || /^\$?0\.?0*$/.test(item.price.trim());
    price.className = 'row-price' + (isFree ? ' free' : '');
    price.textContent = isFree ? 'Free' : item.price;
    row.appendChild(price);

    row.addEventListener('click', function () {
      log('card tapped: ' + item.title);
      openDetail(idx);
    });
    return row;
  }

  function renderList(list) {
    listItemsEl.innerHTML = '';
    if (!list || list.length === 0) {
      setListStatus('error', 'No games returned by the feed.');
      return;
    }
    setListStatus('hidden');
    // Append in small batches via setTimeout so the chunked cache builder
    // has time to advance between batches. 36 appendChilds in one tick
    // appears to put the build in a state where it never finishes painting
    // to screen (visible-only-after-tap symptom).
    const BATCH = 4;
    const TICK = 30;
    let nextIdx = 0;
    function pumpBatch() {
      const stopAt = Math.min(nextIdx + BATCH, list.length);
      for (; nextIdx < stopAt; nextIdx++) {
        listItemsEl.appendChild(buildRow(list[nextIdx], nextIdx));
      }
      if (nextIdx < list.length) {
        setTimeout(pumpBatch, TICK);
      } else {
        log('renderList: batched append complete (' + list.length + ' items)');
      }
    }
    pumpBatch();
  }

  // ---------- detail render ----------
  function openDetail(idx) {
    const item = items[idx];
    if (!item) return;
    detailItem = item;
    view = 'detail';
    // The detail thumbnail is one image — fire immediately. But drop the
    // background list-thumbnail queue so its in-flight connects don't
    // race with the detail thumb we actually care about right now.
    invalidateThumbQueue();

    detailTitleEl.textContent = item.title;
    detailAuthorEl.textContent = item.author ? 'by ' + item.author : '';
    const metaBits = [];
    if (item.tags.length) metaBits.push(item.tags.join(' · '));
    if (item.pubDate) metaBits.push(item.pubDate);
    detailMetaEl.textContent = metaBits.join(' • ');
    detailDescEl.textContent = item.description ||
      '(no description in the feed entry)';
    detailUrlEl.textContent = item.link;

    if (item.imageurl && !isUnsafeThumbnailUrl(item.imageurl)) {
      detailThumbEl.setAttribute('src', item.imageurl);
    } else {
      detailThumbEl.removeAttribute('src');
    }

    // Slice-3 stub: Play always navigates to the configured test URL
    // regardless of which card was tapped. Per-card extraction (fetching
    // the project page and decoding data-iframe) is a later slice.
    playBtnEl.setAttribute('href', appConfig.testGameUrl);

    listViewEl.classList.add('hidden');
    detailViewEl.classList.remove('hidden');
  }

  function closeDetail() {
    view = 'list';
    detailItem = null;
    detailViewEl.classList.add('hidden');
    listViewEl.classList.remove('hidden');
  }

  // ---------- feed load orchestrator ----------
  async function loadFeed(feedKey) {
    // Drop any thumbnail loads still queued from the previous feed —
    // they'd otherwise burn TCP slots on rows the user no longer sees.
    invalidateThumbQueue();
    setListStatus('loading', 'Loading ' + FEEDS[feedKey].label + '…');
    listHeaderEl.textContent = FEEDS[feedKey].header;
    listItemsEl.innerHTML = '';
    items = [];
    try {
      const parsed = await fetchFeed(feedKey);
      items = parsed;
      renderList(parsed);
    } catch (err) {
      const msg = (err && err.message) ? err.message : String(err);
      log('  feed load FAILED: ' + msg);
      let display = 'Couldn\'t load ' + FEEDS[feedKey].label + ' feed';
      if (/HTTP/.test(msg)) display += ' (' + msg + ')';
      setListStatus('error', display);
    }
  }

  // ---------- boot ----------
  async function boot() {
    log('--- itchio-app ' + APP_VERSION + ' boot ' +
        new Date().toISOString() + ' ---');

    appConfig = await loadConfig();
    currentFeed = appConfig.feed;
    renderSidebar();

    // Initial Play href so the anchor is wired even before any card tap.
    playBtnEl.setAttribute('href', appConfig.testGameUrl);

    await loadFeed(currentFeed);

    detailBackEl.addEventListener('click', function () {
      log('Back tapped: closing detail');
      closeDetail();
    });

    // Multi-stage B-button ([[swb-back-button-page-intercept]]):
    // in detail → close detail; at list → let shell goBack (exits app).
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (view === 'detail') {
        log('B button: closing detail');
        closeDetail();
        e.preventDefault();
      }
    });

    log('  boot complete');
  }

  boot().catch(function (err) {
    log('boot FAILED: ' + (err && err.message ? err.message : err));
  });
</script>

</body>
</html>
