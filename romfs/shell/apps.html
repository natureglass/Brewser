<!doctype html>
<html lang="en">
<head>
<title>Apps · Brewser</title>
<link rel="stylesheet" href="brewser://assets/main.css">
<style>
  body { padding: 32px 28px 28px; }
  /* Parse-report line in the Check-for-Updates modal. Quiet single
     line on a clean sync; the --drift modifier (any dropped entry or
     unknown field reported by the platform client) switches to the
     warning palette so drift is impossible to miss. */
  .updates-modal-report { margin-top: 10px; font-size: 13px; color: #8fa1bd; }
  .updates-modal-report--drift { color: #e8b34b; }
</style>
</head>
<body data-telemetry-url="<browser-config-telemetry/>" data-warnings="<browser-config-warnings/>">

<!-- The four browse tabs mirror the WordPress plugin: Featured is a
     curation FILTER; Most Recent / Popular / Top Rated are sorts fed by
     the library tabs the shell computes (publishedAt + stats.json). A
     tab whose driving data is absent renders unavailable with a reason
     instead of a fake ordering. Featured is the checked default until
     publishedAt flows from the platform (then `recent` takes over,
     matching the web's default sort). -->
<input type="radio" id="apps-tab-featured" name="apps-tab" checked>
<input type="radio" id="apps-tab-recent" name="apps-tab">
<input type="radio" id="apps-tab-popular" name="apps-tab">
<input type="radio" id="apps-tab-toprated" name="apps-tab">

<div class="page-shell">
  <!-- Top toolbar: tab strip flush left, action buttons flush right.
       Keeps `.tab-bar` a descendant of `.page-shell` so the
       `:checked ~ .page-shell .tab-label[for=…]` cascade still
       resolves the active tab without any selector change. -->
  <div class="apps-toolbar clickable">
    <nav class="tab-bar" aria-label="App library tabs">
      <label for="apps-tab-featured" class="tab-label">Featured</label>
      <label for="apps-tab-recent" class="tab-label">Most Recent</label>
      <label for="apps-tab-popular" class="tab-label">Popular</label>
      <label for="apps-tab-toprated" class="tab-label">Top Rated</label>
    </nav>
    <button type="button" class="munch-link apps-check-updates" data-catalogue-url="<browser-config-catalogue/>" data-stats-url="<browser-config-stats/>" data-downloads-url="<browser-config-downloads/>" data-ratings-url="<browser-config-ratings/>" data-versions-url="<browser-config-versions/>">Check for Updates</button>
  </div>
  <div class="tab-panels clickable">
    <section class="tab-panel" data-tab="featured" aria-label="Featured apps">
      <div class="app-grid">
        <browser-tab-featured></browser-tab-featured>
      </div>
    </section>
    <section class="tab-panel" data-tab="recent" aria-label="Most recent apps">
      <div class="app-grid">
        <browser-tab-recent></browser-tab-recent>
      </div>
    </section>
    <section class="tab-panel" data-tab="popular" aria-label="Popular apps">
      <div class="app-grid">
        <browser-tab-popular></browser-tab-popular>
      </div>
    </section>
    <section class="tab-panel" data-tab="toprated" aria-label="Top rated apps">
      <div class="app-grid">
        <browser-tab-toprated></browser-tab-toprated>
      </div>
    </section>
  </div>
</div>

<!-- Missing-app detail modal. The `<browser-modal>` tag expands to a
     `<div data-engine-modal="true" style="position: fixed" …>` — the
     engine recognises the stamp and paints the subtree from its own
     offscreen cache (`paintModalOverlay`), separate from the host
     page's `liveCacheOffscreen`. Per-modal mutations (open / close
     class flip, async logo onload, title text updates) route through
     `modalTreeVersion` instead of the host's `liveTreeVersion`, so the
     host cache stays warm AND modal pixels can never leak into it
     (the original logo-ghost bug). See live-paint-control.ts modal-
     layer block for the full rationale.

     Hidden by default — main.css's `.app-modal-overlay { display:
     none }` rule applies until the page script flips
     `.app-modal-overlay--open` on Cancel / B-button / L-back. The
     modal HTML is shared verbatim with home.html — keep the two in
     sync if either side changes. -->
<browser-modal id="app-modal-overlay" class="app-modal-overlay">
  <div class="app-modal-card">
    <!-- Meta strip mirrors the `.app-card__meta` strip on grid cards:
         version chip flush left, license chip flush right, both in a
         row above the logo. The strip is rendered conditionally by
         the script (hidden when both fields are empty). -->
    <div id="app-modal-meta" class="app-modal-meta">
      <div id="app-modal-version" class="app-meta__version"></div>
      <div id="app-modal-license" class="app-meta__license"></div>
    </div>
    <!-- Header row: logo flush-left, title + identifier + description
         stacked on its right. `app-modal-identifier` is the app's
         dotted ID (e.g. `com.natureglass.domhtmlcss`) — promoted out
         of the body rows (where "Identifier" used to be a labeled
         row) so it sits next to the title as the modal's primary
         meta. The body below keeps the remaining labeled rows
         (Category / Features / Permissions / Allowed origins /
         Developer / Source). -->
    <div class="app-modal-header">
      <img id="app-modal-logo" class="app-modal-logo" src="brewser://assets/download.png" alt="App logo">
      <div class="app-modal-header-text">
        <h2 id="app-modal-title" class="app-modal-title">App</h2>
        <p id="app-modal-identifier" class="app-modal-identifier"></p>
        <p id="app-modal-description" class="app-modal-description"></p>
      </div>
    </div>
    <!-- Body rows: missing-app-modal.js prepends Downloads + Rating
         rows here (so they share the body's text-align: left + the
         existing `.app-modal-row` border / spacing), then the
         existing Category / Features / etc. metadata rows. -->
    <div id="app-modal-body" class="app-modal-body"></div>
    <!-- Two-slot action row. LEFT holds the upgrade-install button
         (only visible when the installed manifest's version differs
         from the catalog's — i.e. `installedVersion && version`).
         RIGHT holds Cancel + Play (installed apps) or Cancel +
         Download (missing apps). Play is an `<a>` so its tap fires
         findTapIntent → navigate intent in the shell (no new
         shell-side action wiring needed); the script stamps the href
         from `detail.url` at open time. Visibility of each button is
         toggled via `app-modal-btn--hidden` so only the right set is
         shown for the current detail.missing / detail.installedVersion
         combination. -->
    <div class="app-modal-actions">
      <div class="app-modal-actions-side">
        <button id="app-modal-update" class="app-modal-btn app-modal-btn--download app-modal-btn--hidden" type="button">Update</button>
        <!-- Install-size chip. Populated by missing-app-modal.js from
             `detail.sizeBytes` (catalogue.json) as a megabyte figure.
             Lives in the LEFT action slot so it sits flush-left below
             the card — alongside the Update button when one is shown
             (upgrade case), or alone when no left-side button is
             visible (missing / installed-current cases). The script
             hides it when sizeBytes is 0 (catalog omitted the field). -->
        <span id="app-modal-size" class="app-modal-size"></span>
        <!-- SD free-space chip. Populated by missing-app-modal.js via
             `Switch.FileSystem.openSdmc().freeSpace()` each time the
             modal opens. Painted in red (`--warn`) when the free
             space is less than the catalog's `sizeBytes` so the user
             sees at a glance why Download / Update is disabled. -->
        <span id="app-modal-sd-free" class="app-modal-size app-modal-size--sd"></span>
      </div>
      <div class="app-modal-actions-side">
        <button id="app-modal-cancel" class="app-modal-btn" type="button">Cancel</button>
        <a id="app-modal-play" class="app-modal-btn app-modal-btn--play app-modal-btn--hidden" role="button">Launch</a>
        <button id="app-modal-download" class="app-modal-btn app-modal-btn--download app-modal-btn--hidden" type="button">Download</button>
      </div>
    </div>
  </div>
</browser-modal>

<!-- Check-for-Updates modal. Same overlay/card pattern as the
     missing-app modal above — separate `updates-modal-*` ID prefix so
     both modals can coexist in the page without selector collisions.
     The `<browser-modal>` tag (see app-modal-overlay above) stamps
     `data-engine-modal="true"` + inline `position: fixed` for the
     engine's modal-layer paint pass. Visibility flips via
     `.updates-modal-overlay--open` (NOT `style.display`). -->
<browser-modal id="updates-modal-overlay" class="app-modal-overlay updates-modal-overlay">
  <div id="updates-modal-card" class="app-modal-card updates-modal-card">
    <h2 class="app-modal-title updates-modal-title">Check for new Apps &amp; updates</h2>
    <!-- Loading state: a CSS-animated indeterminate bar. Visible while
         `.updates-modal-card` carries `updates-modal-card--loading`;
         the JS removes that class after 3 s and the table slot below
         takes over. -->
    <div class="updates-modal-loading">
      <div class="updates-modal-loading-bar"></div>
    </div>
    <!-- Results table. Scrolls vertically when its content exceeds
         the card's max-height; the card itself is bounded so the OK
         button row stays pinned at the bottom. Populated by JS once
         the 3 s loading phase ends — empty rows mean no new apps and
         no updates available. -->
    <div id="updates-modal-results" class="updates-modal-results">
      <div id="updates-modal-empty" class="updates-modal-empty">No new apps or updates available.</div>
      <!-- Error slot — shown when the card carries `--error` (the JS
           writes a human-readable message here on fetch / parse / write
           failure). Sits above the section list so the empty / sections
           stay hidden via the `--error` selector below. -->
      <div id="updates-modal-error" class="updates-modal-error"></div>
      <div id="updates-modal-new-section" class="updates-modal-section">
        <h3 class="updates-modal-section-title">New apps</h3>
        <div id="updates-modal-new" class="updates-modal-list"></div>
      </div>
      <div id="updates-modal-update-section" class="updates-modal-section">
        <h3 class="updates-modal-section-title">Updates</h3>
        <div id="updates-modal-update" class="updates-modal-list"></div>
      </div>
      <!-- Parse-report line — the drift-visibility payload: catalogue
           version + app count on every successful sync, plus itemized
           dropped entries / unknown fields / unknown permissions /
           unknown sources / undecoded entities whenever the platform
           client reported any. Populated by renderParseReport() in
           updates-modal.js. -->
      <div id="updates-modal-report" class="updates-modal-report"></div>
    </div>
    <div class="app-modal-actions updates-modal-actions">
      <div class="app-modal-actions-side">
        <!-- Status line — populated by the JS once the fetch settles.
             Hidden while the card carries `--loading` so the message
             only surfaces once the check completes. `--error` on the
             card swaps the green success palette for red error; both
             read from the same span so the markup stays simple. -->
        <span id="updates-modal-status" class="updates-modal-status">Local Catalog is now synced!</span>
      </div>
      <div class="app-modal-actions-side">
        <!-- Two action buttons share the right slot, one visible at a
             time. During the 3 s check the RED "Cancel" button is
             shown (lets the user abort mid-check); once the check
             completes the GREEN "Close" button replaces it. Visibility
             is class-driven via `--loading` on the card (same gate as
             the loading bar / results swap) — both buttons stay in
             the DOM and only their `display` toggles. -->
        <button id="updates-modal-cancel" class="app-modal-btn app-modal-btn--download updates-modal-btn-cancel" type="button">Cancel</button>
        <button id="updates-modal-close" class="app-modal-btn app-modal-btn--play updates-modal-btn-close" type="button">Close</button>
      </div>
    </div>
  </div>
</browser-modal>

<!-- Download / Update progress modal. Opened by missing-app-modal.js
     after a Download / Update tap. Mirrors the Check-for-Updates modal
     shape — overlay + bounded card + class-driven visibility. The
     `<browser-modal>` tag stamps the engine modal-layer hints (see
     above). download-modal.js drives the progress bar fill + counter
     as each file in the artifact manifest lands on disk. -->
<browser-modal id="download-modal-overlay" class="app-modal-overlay download-modal-overlay">
  <div id="download-modal-card" class="app-modal-card download-modal-card">
    <h2 id="download-modal-title" class="app-modal-title download-modal-title">Downloading app</h2>
    <!-- Progress slot — visible while the card carries `--loading`.
         Bar fill width is driven by JS as each file lands; the
         counter ("5/28") reads the same source of truth. The error
         and success states (`--error` / `--success`) hide this slot
         in favour of the message line below. -->
    <div class="download-modal-progress">
      <div class="download-modal-progress-track">
        <div id="download-modal-progress-fill" class="download-modal-progress-fill"></div>
      </div>
      <!-- Two-up indicator row below the track: remaining megabytes
           flush-left, "done/total" file counter flush-right. The MB
           figure is the catalog's `sizeBytes` minus the actual bytes
           pulled off the wire so far (clamped at 0). When the catalog
           omits `sizeBytes` the MB cell flips to "X.X MB downloaded"
           so the user still sees real progress. -->
      <div class="download-modal-progress-row">
        <div id="download-modal-remaining" class="download-modal-remaining"></div>
        <div id="download-modal-counter" class="download-modal-counter"></div>
      </div>
    </div>
    <!-- Error slot — populated by JS on any failure (network, non-2xx,
         write error). Hidden unless the card carries `--error`. -->
    <div id="download-modal-error" class="download-modal-error"></div>
    <div class="app-modal-actions download-modal-actions">
      <div class="app-modal-actions-side">
        <!-- Status line — flips between "Fetching manifest…",
             "Downloading files…", success ("X is ready to play!"),
             and error ("Download failed."). Green / red palettes are
             gated by `--success` / `--error` on the card. -->
        <span id="download-modal-status" class="download-modal-status">Preparing…</span>
      </div>
      <div class="app-modal-actions-side">
        <!-- Cancel during loading, Close after success/error. Visibility
             gated via class flips on the card, same approach the
             Check-for-Updates modal takes. -->
        <button id="download-modal-cancel" class="app-modal-btn app-modal-btn--download download-modal-btn-cancel" type="button">Cancel</button>
        <button id="download-modal-close" class="app-modal-btn app-modal-btn--play download-modal-btn-close" type="button">Close</button>
      </div>
    </div>
  </div>
</browser-modal>

<!-- Permission-warnings modal. Opened by missing-app-modal.js on a
     Launch tap when one or more of the app's `permissions` keys match
     an entry in `configs/warnings.json`. Lists each matched warning
     (key + risk badge + warning text). Cancel closes only THIS modal
     (the app modal stays open behind it); Launch closes THIS modal +
     navigates to the app URL via the `<a href>` stamped on the Launch
     button at open time (engine's findTapIntent picks up the href
     after click dispatch). z-index bumped to 1001 so it consistently
     paints above the app-detail modal (both share `.app-modal-overlay`
     which is z-index 1000). -->
<browser-modal id="warnings-modal-overlay" class="app-modal-overlay warnings-modal-overlay">
  <div class="app-modal-card warnings-modal-card">
    <h2 class="app-modal-title warnings-modal-title">Permissions warning</h2>
    <!-- Scrollable list of matched warnings. Each row is rendered by
         warnings-modal.js from the matched warnings list. The card
         bounds its own max-height; this slot claims the leftover
         space (`flex: 1 1 auto`) and scrolls. -->
    <div id="warnings-modal-list" class="warnings-modal-list"></div>
    <div class="app-modal-actions warnings-modal-actions">
      <div class="app-modal-actions-side"></div>
      <div class="app-modal-actions-side">
        <button id="warnings-modal-cancel" class="app-modal-btn" type="button">Cancel</button>
        <!-- Launch is an `<a role="button">` so the engine's
             findTapIntent walks up to the href on tap and fires a
             navigate intent (same path the missing-app modal's Play
             button uses). The href is stamped at open time from the
             URL captured by missing-app-modal.js. -->
        <a id="warnings-modal-launch" class="app-modal-btn app-modal-btn--play" role="button">Launch</a>
      </div>
    </div>
  </div>
</browser-modal>

<!-- Script load order matters: download-modal.js installs
     `globalThis.__brewserOpenDownloadModal` synchronously at load;
     warnings-modal.js installs `__brewserOpenWarningsModal` +
     `__brewserGetWarningsForPermissions`; auth-shared.js installs
     `globalThis.__swbAuth` (read by the modal's rating-row tap
     handler to derive the userId for the telemetry POST). All three
     must load BEFORE missing-app-modal.js so the globals are
     available by the time its click handlers fire. -->
<script src="brewser://scripts/download-modal.js"></script>
<script src="brewser://scripts/warnings-modal.js"></script>
<script src="brewser://scripts/auth-shared.js"></script>
<script src="brewser://scripts/missing-app-modal.js"></script>
<script src="brewser://scripts/updates-modal.js"></script>
</body>
</html>
