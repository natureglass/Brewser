<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Picker</title>
<style>
  body {
    --tp-backdrop: rgba(8, 12, 20, 0.78);
    --tp-panel-bg: #141a25;
    --tp-panel-border: #2c3a52;
    --tp-header-bg: #1d2738;
    --tp-text: #e3eaf6;
    --tp-text-dim: #8794ad;
    --tp-accent: #7aa2ff;
    --tp-row-selected: #2d5cd2;
    --tp-row-divider: #1f293a;
    --tp-btn-bg: #1d2c43;
    --tp-btn-bg-active: #25395a;
    --tp-btn-bg-primary: #2d5cd2;
    --tp-btn-bg-primary-active: #4276ed;
    --tp-btn-text: #e3eaf6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    border: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--tp-backdrop);
    color: var(--tp-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 18px;
  }

  .tp-panel {
    width: 460px;
    height: 460px;
    background: var(--tp-panel-bg);
    border: 1px solid var(--tp-panel-border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .tp-header {
    background: var(--tp-header-bg);
    padding: 16px 24px 12px 24px;
    border-bottom: 1px solid var(--tp-panel-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .tp-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--tp-text);
  }

  .tp-readout {
    font-size: 28px;
    font-weight: 700;
    color: var(--tp-accent);
    font-family: "Lucida Console", Monaco, monospace;
  }

  .tp-cols {
    flex: 1;
    display: flex;
    gap: 12px;
    padding: 12px 24px;
  }

  .tp-col {
    flex: 1;
    overflow-y: scroll;
    background: #0f1520;
    border: 1px solid var(--tp-panel-border);
    border-radius: 8px;
  }

  .tp-row {
    padding: 12px 0;
    border-bottom: 1px solid var(--tp-row-divider);
    text-align: center;
    color: var(--tp-text);
    font-size: 20px;
  }

  .tp-row:active {
    background: var(--tp-row-selected);
  }

  .tp-row--selected {
    background: var(--tp-row-selected);
    color: #ffffff;
    font-weight: 600;
  }

  .tp-row--dimmed {
    color: var(--tp-text-dim);
    opacity: 0.35;
  }

  .tp-row-label {
    font-family: "Lucida Console", Monaco, monospace;
  }

  .tp-footer {
    background: var(--tp-header-bg);
    padding: 12px 24px;
    border-top: 1px solid var(--tp-panel-border);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
  }

  .tp-btn {
    padding: 10px 18px;
    border-radius: 8px;
    background: var(--tp-btn-bg);
    color: var(--tp-btn-text);
    font-size: 15px;
    font-weight: 500;
    border: 1px solid var(--tp-panel-border);
  }

  .tp-btn:active {
    background: var(--tp-btn-bg-active);
  }

  .tp-btn--primary {
    background: var(--tp-btn-bg-primary);
    border-color: var(--tp-btn-bg-primary);
  }

  .tp-btn--primary:active {
    background: var(--tp-btn-bg-primary-active);
  }

  .tp-btn--hidden {
    display: none;
  }
</style>
</head>
<body data-action="cancel">
  <div class="tp-panel" data-action="ignore">
    <div class="tp-header">
      <div class="tp-title" id="tp-title"><span>Select time</span></div>
      <div class="tp-readout" id="tp-readout"><span>--:--</span></div>
    </div>
    <div class="tp-cols">
      <div class="tp-col" id="tp-hours"></div>
      <div class="tp-col" id="tp-minutes"></div>
    </div>
    <div class="tp-footer">
      <div class="tp-btn tp-btn--hidden" id="tp-clear" data-action="clear"><span>Clear</span></div>
      <div class="tp-btn" data-action="cancel"><span>Cancel</span></div>
      <div class="tp-btn tp-btn--primary" id="tp-confirm" data-action="confirm"><span>Done</span></div>
    </div>
  </div>
</body>
</html>
