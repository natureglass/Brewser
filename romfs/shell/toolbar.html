<!DOCTYPE html>
<html>
<head>
<style>
  .addressbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: #f5f5f5;
    border: 1px solid #ddd;
    font-family: Arial, sans-serif;
  }
  .btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #333;
    padding: 0;
  }
  .btn.disabled { color: #bbb; cursor: default; }
  .url {
    flex: 1;
   
    padding-left: 16px;
    font-size: 20px;
    color: #222;
  }
  .mode {
    font-size: 13px;
    letter-spacing: 1px;
    color: #999;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ff5a5a;
  }
  .gear {
    font-size: 22px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="addressbar">
  <button class="btn" id="backButton">
    <img src="./assets/left_black.png" alt="Back" width="28" height="28">
  </button>
  <button class="btn disabled" id="forwardButton">
    <img src="./assets/right_black.png" alt="Back" width="28" height="28">
  </button>
  <button class="btn" id="refreshButton">
    <img src="./assets/refresh_black.png" alt="Back" width="28" height="28">
  </button>
  <button class="btn" id="homeButton">
    <img src="./assets/home_black.png" alt="Back" width="28" height="28">
  </button>
  <button class="btn" id="bookmarkButton">
    <img src="./assets/bookmark_false_black.png" alt="Back" width="22" height="22">
  </button>
  <input class="url" type="text" id="url" name="url" value="https://www.google.com" readonly>
  <span class="mode">HANDHELD</span>
  <span class="dot"></span>
  <span class="gear">
    <img src="./assets/settings_black.png" alt="Back" width="28" height="28">
  </span>
  <button class="btn" id="avatarButton">
    <img src="./assets/avatar_default.png" alt="avatar" width="28" height="28">
  </button>
</div>

</body>
</html>
