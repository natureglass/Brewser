<!doctype html>
<html lang="en">
<head>
<title>Achievements · Brewser</title>
<link rel="stylesheet" href="brewser://assets/main.css">
<style>
  /* Structural layout only — every colour lives in the per-theme stylesheets
     (themes/styles/*.css) so each tier fieldset picks up the same palette the
     Settings page uses. The theme sheet is concatenated ahead of this inline
     block, so anything with a colour here would win the cascade and flatten
     all four themes to one look; keep this block palette-free on purpose. */
  body { padding: 32px 28px 28px; }
  .ach-summary { font-size: 18px; margin: 4px 0 24px; }
  /* Each tier is a <fieldset class="ach-group"> — the fieldset/legend chrome
     comes from the theme sheet; this just spaces the groups apart. */
  .ach-group { margin: 0 0 22px; }
  .ach-tier__head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0; }
  .ach-tier__blurb { font-size: 14px; margin: 0; }
  .ach-tier__count { font-size: 14px; margin-left: auto; }
  .ach-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 14px; }
  /* Badges are listener-only <a>s (no href) — tap opens the detail modal
     (achievements.js). cursor:pointer signals that; text-decoration:none keeps
     the anchor from underlining the badge name. */
  .ach-badge { width: 160px; text-align: center; cursor: pointer; text-decoration: none; }
  .ach-badge__img { width: 112px; height: 112px; object-fit: contain; display: block; margin: 0 auto 10px; }
  /* Not-yet-earned badges render at 50% opacity. */
  .ach-badge--locked .ach-badge__img { opacity: 0.5; }
  .ach-badge__name { font-weight: 600; font-size: 16px; }
  .ach-empty { font-size: 16px; }

  /* ---- Badge detail modal (structure only; colours come from the theme) ----
     The overlay / card / title / button chrome is the shared `.app-modal-*`
     family (themed in every themes/styles/*.css) so the modal matches each
     theme's modal palette. The description inherits the card's themed text
     colour; the tier line, status pill and criteria are palette-themed as
     `.ach-modal-*` in those same sheets. These rules only size + centre. */
  .ach-modal-card { width: 420px; max-width: 100%; }
  .ach-modal-badge { display: block; width: 128px; height: 128px; object-fit: contain; margin: 4px auto 14px; }
  .ach-modal-badge--locked { opacity: 0.5; }
  .ach-modal-title { text-align: center; }
  .ach-modal-tier { font-size: 14px; margin: 0 0 12px; }
  /* Centre the earned/locked pill via a flex row. The live-DOM engine does NOT
     centre an inline-block through the parent's text-align (a known inline-block
     trap) — that's why the title/tier/description centre their own text but the
     pill would sit flush left. flex justify-content:center is reliable here (the
     same thing that centres the Close button row). 5px top-margin per request. */
  .ach-modal-status-row { display: flex; justify-content: center; margin: 5px 0 16px; }
  .ach-modal-status { display: inline-block; padding: 5px 16px; border-radius: 999px; border: 1px solid transparent; font-weight: 700; font-size: 14px; }
  .ach-modal-desc { font-size: 15px; line-height: 1.5; text-align: center; margin: 0 0 6px; }
  .ach-modal-criteria { font-size: 14px; line-height: 1.45; text-align: center; margin: 6px 0 18px; }
  .ach-modal-actions { display: flex; justify-content: center; margin-top: 4px; }
  .ach-modal-hidden { display: none; }
</style>
</head>
<body>
  <div class="page-shell">
    <section class="top-section clickable">
      <header class="top-header">
        <h2>Achievements</h2>
        <nav class="top-links" aria-label="Browser navigation">
          <a class="munch-link" href="brewser://googleLogin/">Account</a>
          <a class="munch-link" href="brewser://home/">Home</a>
        </nav>
      </header>
    </section>
    <p id="ach-summary" class="ach-summary"></p>
    <div id="ach-root"></div>
  </div>

  <!-- Badge detail modal. MUST be a <browser-modal>, NOT a plain <div>: the
       resource loader expands the tag to a <div data-engine-modal="true"
       style="position:fixed"> that the engine registers as a modal-layer root
       and paints/erases from its own offscreen cache. A plain <div> gets
       position:fixed from CSS only, which the paint pass does NOT treat as a
       modal root — closing it then leaves the overlay half-erased with
       artifacts (the "logo-ghost" bug; see the app-modal note in home.html and
       live-paint-control.ts's modal-layer block).
       Reuses the app-catalogue modal chrome (.app-modal-overlay /
       .app-modal-card / .app-modal-title / .app-modal-btn — themed in every
       themes/styles/*.css) so it matches each theme's modal colours;
       achievement-specific accents (.ach-modal-*) are palette-themed there too.
       Hidden until achievements.js flips `.app-modal-overlay--open`. -->
  <browser-modal id="ach-modal-overlay" class="app-modal-overlay">
    <div class="app-modal-card ach-modal-card">
      <img id="ach-modal-badge" class="ach-modal-badge" src="" alt="">
      <h3 id="ach-modal-title" class="app-modal-title ach-modal-title"></h3>
      <div id="ach-modal-tier" class="ach-modal-tier"></div>
      <div class="ach-modal-status-row">
        <div id="ach-modal-status" class="ach-modal-status"></div>
      </div>
      <p id="ach-modal-desc" class="ach-modal-desc"></p>
      <div id="ach-modal-criteria" class="ach-modal-criteria"></div>
      <div class="ach-modal-actions">
        <button id="ach-modal-close" class="app-modal-btn">Close</button>
      </div>
    </div>
  </browser-modal>

  <!-- auth-shared.js exposes globalThis.__swbAuth.readActiveSession(); loaded
       first so achievements.js can gate earned badges on an active session. -->
  <script src="brewser://scripts/auth-shared.js"></script>
  <script src="brewser://scripts/achievements.js"></script>
</body>
</html>
