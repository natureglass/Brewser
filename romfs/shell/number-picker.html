<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Picker</title>
<style>
  body {
    --np-backdrop: rgba(8, 12, 20, 0.78);
    --np-panel-bg: #141a25;
    --np-panel-border: #2c3a52;
    --np-header-bg: #1d2738;
    --np-text: #e3eaf6;
    --np-text-dim: #8794ad;
    --np-accent: #7aa2ff;
    --np-track-bg: #0f1520;
    --np-btn-bg: #1d2c43;
    --np-btn-bg-active: #25395a;
    --np-btn-bg-primary: #2d5cd2;
    --np-btn-bg-primary-active: #4276ed;
    --np-btn-text: #e3eaf6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    border: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--np-backdrop);
    color: var(--np-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 18px;
  }

  .np-panel {
    width: 520px;
    height: 300px;
    background: var(--np-panel-bg);
    border: 1px solid var(--np-panel-border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .np-header {
    background: var(--np-header-bg);
    padding: 12px 20px;
    border-bottom: 1px solid var(--np-panel-border);
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }

  .np-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--np-text);
  }

  .np-body {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    padding: 16px 24px;
    gap: 18px;
  }

  .np-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 76px;
  }

  .np-step-btn {
    width: 64px;
    height: 56px;
    border-radius: 10px;
    background: var(--np-btn-bg);
    border: 1px solid var(--np-panel-border);
    color: var(--np-text);
    font-size: 24px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
  }

  .np-step-btn--big {
    width: 76px;
    height: 44px;
    font-size: 18px;
  }

  .np-step-btn--hidden {
    display: none;
  }

  .np-step-btn:active {
    background: var(--np-btn-bg-active);
  }

  .np-step-btn--dimmed {
    color: var(--np-text-dim);
    background: var(--np-track-bg);
  }

  .np-readout {
    flex: 1;
    text-align: center;
    color: var(--np-accent);
    font-size: 64px;
    font-weight: 700;
    font-family: monospace;
    padding: 0 12px;
    border-radius: 8px;
  }

  .np-readout:active {
    background: var(--np-btn-bg-active);
  }

  .np-footer {
    background: var(--np-header-bg);
    padding: 12px 20px;
    border-top: 1px solid var(--np-panel-border);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
  }

  .np-btn {
    padding: 10px 18px;
    border-radius: 8px;
    background: var(--np-btn-bg);
    color: var(--np-btn-text);
    font-size: 15px;
    font-weight: 500;
    border: 1px solid var(--np-panel-border);
  }

  .np-btn:active {
    background: var(--np-btn-bg-active);
  }

  .np-btn--primary {
    background: var(--np-btn-bg-primary);
    border-color: var(--np-btn-bg-primary);
  }

  .np-btn--primary:active {
    background: var(--np-btn-bg-primary-active);
  }
</style>
</head>
<body data-action="cancel">
  <div class="np-panel" data-action="ignore">
    <div class="np-header">
      <div class="np-title"><span>Pick a number</span></div>
    </div>
    <div class="np-body">
      <div class="np-col">
        <div class="np-step-btn np-step-btn--big" id="np-bigstep-dec" data-action="bigstep-dec"><span>−10</span></div>
        <div class="np-step-btn" id="np-step-dec" data-action="step-dec"><span>−</span></div>
      </div>
      <div class="np-readout" id="np-readout" data-action="edit-value"><span>0</span></div>
      <div class="np-col">
        <div class="np-step-btn np-step-btn--big" id="np-bigstep-inc" data-action="bigstep-inc"><span>+10</span></div>
        <div class="np-step-btn" id="np-step-inc" data-action="step-inc"><span>+</span></div>
      </div>
    </div>
    <div class="np-footer">
      <div class="np-btn" data-action="cancel"><span>Cancel</span></div>
      <div class="np-btn np-btn--primary" data-action="ok"><span>OK</span></div>
    </div>
  </div>
</body>
</html>
