<!doctype html>
<html lang="en">
  <head>
    <title>Login with Google — Brewser</title>
    <link rel="stylesheet" href="brewser://assets/main.css">
    <style>
        .auth-stage { display: none; }
        body[data-auth-stage="email"]   .auth-stage-email   { display: block; }
        body[data-auth-stage="device"]  .auth-stage-device  { display: block; }
        body[data-auth-stage="success"] .auth-stage-success { display: block; }
        body[data-auth-stage="error"]   .auth-stage-error   { display: block; }

        #auth-verification-url { font-size: 28px; min-height: 48px; padding: 8px 0px; text-align: center; }
        #auth-user-code        { font-size: 64px; min-height: 88px; padding: 8px 0px; text-align: center; }
        #auth-poll-status      { font-size: 20px; min-height: 48px; padding: 12px 16px; text-align: center; }

        /* Email stage: no input any more — just a big, screen-centred
           "Continue with Google" button. The header/lead above are hidden on
           this stage so the button sits in the middle of the 720px screen. */
        body[data-auth-stage="email"] .lead { display: none; }
        .google-login-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 620px;
            gap: 28px;
            text-align: center;
        }
        /* ~2x the default button (body font is 18px; .settings-save padding is
           10px 22px). */
        .google-continue-btn {
            font-size: 38px;
            padding: 22px 50px;
            border-radius: 999px;
        }
        .google-continue-error { font-size: 22px; max-width: 760px; }
        .auth-device-grid {
            display: grid;
            grid-template-columns: 4fr 2fr;
            gap: 24px;
        }
        .settings-group.auth-verification-qr {
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .auth-verification-qr qrcode {
            display: block;
            padding-top: 25px;
            width: 290px;
            height: 290px;
            flex: 0 0 250px;
        }
    </style>
  </head>

 <body data-auth-stage="email" data-google-client-id="<browser-config-google-client-id/>" data-google-client-secret="<browser-config-google-client-secret/>">

    <div class="page-shell">

        <section class="top-section clickable">
            <header class="top-header">
                <h2>Google Account</h2>
                <nav class="top-links" aria-label="Browser navigation">
                <a class="munch-link" href="brewser://home/">Home</a>
                </nav>
            </header>
        </section>

        <p class="lead">Use your Google account.</p>

        <!-- STAGE: start. Just a big, screen-centred "Continue with Google"
             button (the optional email-hint input was removed). -->
        <div class="auth-stage auth-stage-email">
            <div class="google-login-center">
                <button id="auth-submit-email" class="settings-save google-continue-btn" type="button">Continue with Google</button>
                <div id="auth-email-error" class="auth-inline-error google-continue-error"></div>
            </div>
        </div>

        <!-- STAGE: device flow. Steps split into labelled fieldsets. -->
        <div class="auth-stage auth-stage-device">
            <div class="settings-form">

                <div class="auth-device-grid">
                    <div class="auth-device-steps">
                        <fieldset class="settings-group">
                            <legend>Step 1 — Open this URL or Scan the QR Code</legend>
                            <div id="auth-verification-url"></div>
                        </fieldset>

                        <fieldset class="settings-group">
                            <legend>Step 2 — Enter this one-time code</legend>
                            <div id="auth-user-code">…</div>
                        </fieldset>

                        <fieldset class="settings-group">
                            <legend>Status</legend>
                            <div id="auth-poll-status" class="auth-poll-status">Waiting for confirmation…</div>
                        </fieldset>
                    </div>

                    <fieldset class="settings-group auth-verification-qr">
                        <qrcode data="https://www.google.com/device"></qrcode>
                    </fieldset>
                </div>

                <div class="settings-savebar">
                    <a class="settings-save" href="brewser://login/">Cancel</a>
                </div>
            </div>
        </div>

        <!-- STAGE: signed-in -->
        <div class="auth-stage auth-stage-success">
            <div class="settings-form">
                <fieldset class="settings-group" style="display: flex; gap: 24px; align-items: flex-start;">
                    <div style="flex: 1 1 auto;">
                        <div class="settings-row">
                            <span class="settings-label">Email</span>
                            <div id="auth-success-email" style="font-size: 32px; padding: 8px 0; word-break: break-all;"></div>
                        </div>
                        <div class="settings-row">
                            <span class="settings-label">Name</span>
                            <div id="auth-success-name" style="font-size: 32px; padding: 8px 0; word-break: break-all;"></div>
                        </div>
                        <div class="settings-row">
                            <span class="settings-label">Subject (Google user id)</span>
                            <div id="auth-success-sub" style="font-size: 32px; padding: 8px 0; word-break: break-all;"></div>
                        </div>
                    </div>
                    <div style="flex: 0 0 auto; padding-top: 8px;">
                        <img id="auth-success-avatar" alt="" width="160" height="160" style="border-radius: 80px; display: block;">
                    </div>
                </fieldset>
                <div class="settings-savebar">
                    <button id="auth-logout" class="settings-save" type="button">Log out</button>
                </div>
            </div>
        </div>

        <!-- STAGE: error. -->
        <div class="auth-stage auth-stage-error">
            <div class="settings-form">
                <fieldset class="settings-group">
                    <legend>Reason</legend>
                    <div id="auth-error-message" class="auth-inline-error"></div>
                </fieldset>
                <div class="settings-savebar">
                    <a class="settings-save" href="brewser://login/">Back to Sign-in picker</a>
                </div>
            </div>
        </div>

    </div>

    <script src="brewser://scripts/auth-shared.js"></script>
    <script src="brewser://scripts/google-auth.js"></script>

  </body>
</html>
