<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Picker</title>
<style>
  body {
    --dp-backdrop: rgba(8, 12, 20, 0.78);
    --dp-panel-bg: #141a25;
    --dp-panel-border: #2c3a52;
    --dp-header-bg: #1d2738;
    --dp-text: #e3eaf6;
    --dp-text-dim: #8794ad;
    --dp-accent: #7aa2ff;
    --dp-cell-selected: #2d5cd2;
    --dp-cell-today-border: #7aa2ff;
    --dp-row-divider: #1f293a;
    --dp-btn-bg: #1d2c43;
    --dp-btn-bg-active: #25395a;
    --dp-btn-text: #e3eaf6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    border: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--dp-backdrop);
    color: var(--dp-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 18px;
  }

  .dp-panel {
    width: 560px;
    height: 440px;
    background: var(--dp-panel-bg);
    border: 1px solid var(--dp-panel-border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .dp-header {
    background: var(--dp-header-bg);
    padding: 14px 20px 10px 20px;
    border-bottom: 1px solid var(--dp-panel-border);
  }

  .dp-nav {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dp-title {
    flex: 1;
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    color: var(--dp-text);
  }

  .dp-btn--icon {
    padding: 6px 14px;
    border-radius: 8px;
    background: var(--dp-btn-bg);
    color: var(--dp-btn-text);
    font-size: 18px;
    font-weight: 600;
    border: 1px solid var(--dp-panel-border);
    min-width: 36px;
    text-align: center;
  }

  .dp-btn--icon:active {
    background: var(--dp-btn-bg-active);
  }

  .dp-weekdays {
    display: flex;
    margin-top: 10px;
  }

  .dp-weekdays span {
    flex: 1;
    text-align: center;
    color: var(--dp-text-dim);
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .dp-grid {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 8px 12px;
  }

  .dp-row {
    display: flex;
    height: 40px;
  }

  .dp-cell {
    flex: 1;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dp-text);
    border-radius: 6px;
  }

  .dp-cell:active {
    background: var(--dp-cell-selected);
  }

  .dp-cell--off-month {
    color: var(--dp-text-dim);
    opacity: 0.45;
  }

  .dp-cell--dimmed {
    color: var(--dp-text-dim);
    opacity: 0.35;
  }

  .dp-cell--selected {
    background: var(--dp-cell-selected);
    color: #ffffff;
  }

  .dp-cell--today {
    border: 1px solid var(--dp-cell-today-border);
  }

  .dp-cell-label {
    font-size: 16px;
  }

  .dp-footer {
    background: var(--dp-header-bg);
    padding: 12px 20px;
    border-top: 1px solid var(--dp-panel-border);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
  }

  .dp-btn {
    padding: 10px 18px;
    border-radius: 8px;
    background: var(--dp-btn-bg);
    color: var(--dp-btn-text);
    font-size: 15px;
    font-weight: 500;
    border: 1px solid var(--dp-panel-border);
  }

  .dp-btn:active {
    background: var(--dp-btn-bg-active);
  }

  .dp-btn--hidden {
    display: none;
  }
</style>
</head>
<body data-action="cancel">
  <div class="dp-panel" data-action="ignore">
    <div class="dp-header">
      <div class="dp-nav">
        <div class="dp-btn dp-btn--icon" data-action="year-prev"><span>«</span></div>
        <div class="dp-btn dp-btn--icon" data-action="month-prev"><span>‹</span></div>
        <div class="dp-title" id="dp-title"><span>Pick a date</span></div>
        <div class="dp-btn dp-btn--icon" data-action="month-next"><span>›</span></div>
        <div class="dp-btn dp-btn--icon" data-action="year-next"><span>»</span></div>
      </div>
      <div class="dp-weekdays">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
    </div>
    <div class="dp-grid" id="dp-grid"></div>
    <div class="dp-footer">
      <div class="dp-btn" data-action="today"><span>Today</span></div>
      <div class="dp-btn dp-btn--hidden" id="dp-clear" data-action="clear"><span>Clear</span></div>
      <div class="dp-btn" data-action="cancel"><span>Cancel</span></div>
    </div>
  </div>
</body>
</html>
