<!doctype html>
<html lang="en">
<head>
<title>Favorites · Brewser</title>
<link rel="stylesheet" href="brewser://assets/main.css">
<style>
  body { padding: 32px 28px 28px; }
  /* The shared stylesheet hides `.tab-panel` by default and only reveals it
     when its `#apps-tab-<id>` radio is `:checked` (the apps.html tab bar). This
     page has a single always-visible panel and no radios, so force it shown —
     it keeps the `.tab-panel` + `data-tab` markup that apps-pagination.js needs
     to drive Prev/Next. Compound selector beats the base `.tab-panel` rule. */
  .tab-panels .tab-panel { display: block; }
</style>
</head>
<body data-telemetry-url="<browser-config-telemetry/>" data-warnings="<browser-config-warnings/>" data-max-per-page="<browser-config-maxperpage/>" data-lazy-banners="paged">

<div class="page-shell">

  <section class="top-section clickable">
    <header class="top-header">
      <h2>Favorites</h2>
      <nav class="top-links" aria-label="Browser navigation">
        <a class="munch-link" href="brewser://googleLogin/">Account</a>
        <a class="munch-link" href="brewser://home/">Home</a>
      </nav>
    </header>
  </section>

  <!-- Single favorites grid. Cards flow through the SAME server render path
       as the apps.html "My Apps" tab (parseCatalogue → joinLibrary →
       renderAppCards via `<browser-tab-favorites>`), so the markup, the
       `data-app-detail` modal contract, lazy banners and pagination are all
       shared. apps-pagination.js auto-discovers this `data-tab="favorites"`
       panel and drives pages 2…N via the `__brewserAppsPager` hook. -->
  <div class="tab-panels clickable">
    <section class="tab-panel" data-tab="favorites" aria-label="Favorite apps">
      <div class="app-grid">
        <browser-tab-favorites></browser-tab-favorites>
      </div>
      <div class="app-pager app-pager--hidden" data-pager>
        <button type="button" class="munch-link app-pager__btn app-pager__prev">&#8249; Prev</button>
        <span class="app-pager__label"></span>
        <button type="button" class="munch-link app-pager__btn app-pager__next">Next &#8250;</button>
      </div>
    </section>
  </div>
</div>

<!-- App-detail modal — shared VERBATIM with apps.html / home.html (keep the
     three in sync if any side changes). missing-app-modal.js wires each grid
     card's tap to open this. -->
<browser-modal id="app-modal-overlay" class="app-modal-overlay">
  <div id="app-modal-card" class="app-modal-card">
    <div id="app-modal-meta" class="app-modal-meta">
      <div id="app-modal-version" class="app-meta__version"></div>
      <div id="app-modal-license" class="app-meta__license"></div>
    </div>
    <div class="app-modal-header">
      <div class="app-modal-header-text">
        <h2 id="app-modal-title" class="app-modal-title">App</h2>
        <p id="app-modal-identifier" class="app-modal-identifier"></p>
        <div id="app-modal-headstats" class="app-modal-headstats" style="display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:8px;"></div>
        <div id="app-modal-rating-msg-host"></div>
      </div>
    </div>
    <div id="app-modal-description" class="app-modal-description"></div>
    <div id="app-modal-expand-row" class="app-modal-expand-row">
      <span id="app-modal-size" class="app-modal-size"></span>
      <button id="app-modal-expand" class="app-modal-btn app-modal-expand-btn" type="button">Expand</button>
    </div>
    <div id="app-modal-body" class="app-modal-body"></div>
    <div class="app-modal-actions">
      <div class="app-modal-actions-side">
        <button id="app-modal-delete" class="app-modal-btn app-modal-btn--delete app-modal-btn--hidden" type="button">Delete app</button>
        <button id="app-modal-forwarder" class="app-modal-btn app-modal-btn--hidden" type="button">Create shortcut</button>
        <button id="app-modal-update" class="app-modal-btn app-modal-btn--download app-modal-btn--hidden" type="button">Update</button>
      </div>
      <div class="app-modal-actions-side">
        <button id="app-modal-cancel" class="app-modal-btn" type="button">Cancel</button>
        <a id="app-modal-play" class="app-modal-btn app-modal-btn--play app-modal-btn--hidden" role="button">Launch</a>
        <button id="app-modal-download" class="app-modal-btn app-modal-btn--download app-modal-btn--hidden" type="button">Download</button>
      </div>
    </div>
  </div>
</browser-modal>

<!-- Download / Update progress modal — shared verbatim with apps.html. -->
<browser-modal id="download-modal-overlay" class="app-modal-overlay download-modal-overlay">
  <div id="download-modal-card" class="app-modal-card download-modal-card">
    <h2 id="download-modal-title" class="app-modal-title download-modal-title">Downloading app</h2>
    <div class="download-modal-progress">
      <div class="download-modal-progress-track">
        <div id="download-modal-progress-fill" class="download-modal-progress-fill"></div>
      </div>
      <div class="download-modal-progress-row">
        <div id="download-modal-remaining" class="download-modal-remaining"></div>
        <div id="download-modal-counter" class="download-modal-counter"></div>
      </div>
    </div>
    <div id="download-modal-error" class="download-modal-error"></div>
    <div class="app-modal-actions download-modal-actions">
      <div class="app-modal-actions-side">
        <span id="download-modal-status" class="download-modal-status">Preparing…</span>
      </div>
      <div class="app-modal-actions-side">
        <button id="download-modal-cancel" class="app-modal-btn app-modal-btn--download download-modal-btn-cancel" type="button">Cancel</button>
        <button id="download-modal-close" class="app-modal-btn app-modal-btn--play download-modal-btn-close" type="button">Close</button>
      </div>
    </div>
  </div>
</browser-modal>

<!-- Delete (uninstall) progress modal. Opened by missing-app-modal.js
     from the app modal's "Delete app" button. delete-modal.js removes
     every file under sdmc:/switch/brewser/apps/<id> with a progress bar,
     then reloads the grid. Reuses the download modal's progress CSS
     (state classes on `download-modal-card` drive show/hide). -->
<browser-modal id="delete-modal-overlay" class="app-modal-overlay download-modal-overlay">
  <div id="delete-modal-card" class="app-modal-card download-modal-card">
    <h2 id="delete-modal-title" class="app-modal-title download-modal-title">Deleting app</h2>
    <div class="download-modal-progress">
      <div class="download-modal-progress-track">
        <div id="delete-modal-progress-fill" class="download-modal-progress-fill"></div>
      </div>
      <div class="download-modal-progress-row">
        <div id="delete-modal-remaining" class="download-modal-remaining"></div>
        <div id="delete-modal-counter" class="download-modal-counter"></div>
      </div>
    </div>
    <div id="delete-modal-error" class="download-modal-error"></div>
    <div class="app-modal-actions download-modal-actions">
      <div class="app-modal-actions-side">
        <span id="delete-modal-status" class="download-modal-status">Preparing…</span>
      </div>
      <div class="app-modal-actions-side">
        <button id="delete-modal-cancel" class="app-modal-btn app-modal-btn--download download-modal-btn-cancel" type="button">Cancel</button>
        <button id="delete-modal-close" class="app-modal-btn app-modal-btn--play download-modal-btn-close" type="button">Close</button>
      </div>
    </div>
  </div>
</browser-modal>

<!-- Create App Forwarder modal (see home.html for the full note). Confirm slot
     + generation progress; reuses download-modal progress/status/error CSS. -->
<browser-modal id="forwarder-modal-overlay" class="app-modal-overlay download-modal-overlay">
  <div id="forwarder-modal-card" class="app-modal-card download-modal-card" style="display:block;">
    <h2 id="forwarder-modal-title" class="app-modal-title download-modal-title">Create shortcut</h2>
    <div id="forwarder-modal-confirm" style="margin-bottom:20px;">
      <p id="forwarder-modal-explain" style="margin:0 0 16px;"></p>
      <label id="forwarder-modal-embed-row" style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;">
        <input type="checkbox" id="forwarder-modal-embed" style="margin-top:4px;flex:0 0 auto;" />
        <span id="forwarder-modal-embed-label"></span>
      </label>
      <p id="forwarder-modal-embed-note" style="font-size:14px;opacity:0.7;margin:8px 0 0;"></p>
    </div>
    <div class="download-modal-progress" id="forwarder-modal-progress">
      <div class="download-modal-progress-track">
        <div id="forwarder-modal-progress-fill" class="download-modal-progress-fill"></div>
      </div>
    </div>
    <div id="forwarder-modal-error" class="download-modal-error"></div>
    <div class="app-modal-actions download-modal-actions">
      <div class="app-modal-actions-side">
        <span id="forwarder-modal-status" class="download-modal-status"></span>
      </div>
      <div class="app-modal-actions-side">
        <button id="forwarder-modal-cancel" class="app-modal-btn" type="button">Cancel</button>
        <button id="forwarder-modal-create" class="app-modal-btn app-modal-btn--download" type="button">Create shortcut</button>
        <button id="forwarder-modal-close" class="app-modal-btn app-modal-btn--play app-modal-btn--hidden" type="button">Close</button>
      </div>
    </div>
  </div>
</browser-modal>

<!-- Permission-warnings modal — shared verbatim with apps.html. -->
<browser-modal id="warnings-modal-overlay" class="app-modal-overlay warnings-modal-overlay">
  <div class="app-modal-card warnings-modal-card">
    <h2 class="app-modal-title warnings-modal-title">Permissions warning</h2>
    <div id="warnings-modal-list" class="warnings-modal-list"></div>
    <div class="app-modal-actions warnings-modal-actions">
      <div class="app-modal-actions-side"></div>
      <div class="app-modal-actions-side">
        <button id="warnings-modal-cancel" class="app-modal-btn" type="button">Cancel</button>
        <a id="warnings-modal-launch" class="app-modal-btn app-modal-btn--play" role="button">Launch</a>
      </div>
    </div>
  </div>
</browser-modal>

<!-- Same script tail as apps.html MINUS the Check-for-Updates / self-update
     scripts (this page has no such button). download-modal.js + warnings-modal.js
     + auth-shared.js install their globals before missing-app-modal.js wires the
     card taps; banner-loader.js must precede apps-pagination.js (which promotes
     the visible page's data-src banners and drives Prev/Next). -->
<script src="brewser://scripts/download-modal.js"></script>
<script src="brewser://scripts/delete-modal.js"></script>
<script src="brewser://scripts/forwarder-modal.js"></script>
<script src="brewser://scripts/warnings-modal.js"></script>
<script src="brewser://scripts/auth-shared.js"></script>
<script src="brewser://scripts/missing-app-modal.js"></script>
<script src="brewser://scripts/banner-loader.js"></script>
<script src="brewser://scripts/apps-pagination.js"></script>
</body>
</html>
