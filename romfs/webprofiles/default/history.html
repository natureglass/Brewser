<!doctype html>
<html lang="en">
  <head>
    <title>History — Brewser</title>
    <link rel="stylesheet" href="brewser://assets/main.css">
  </head>

  <body>

    <div class="page-shell">

      <section class="top-section">
        <header class="top-header">
          <h2>History</h2>
          <nav class="top-links" aria-label="Browser navigation">
            <button class="clear-btn" type="button" data-action="clear-history">Clear History</button>
            <a class="munch-link" href="brewser://home/">Home</a>
          </nav>
        </header>
      </section>

      <p class="lead">Recent visits, most recent first. Tap a row to open it again.</p>

      <browser-history limit="100"></browser-history>

    </div>

  </body>
</html>
