<!doctype html>
<html lang="en">
  <head>
    <title>Bookmarks — Brewser</title>
    <link rel="stylesheet" href="brewser://assets/main.css">
  </head>

  <body>

    <div class="page-shell">

      <section class="top-section clickable">
        <header class="top-header">
          <h2>Bookmarks</h2>
          <nav class="top-links" aria-label="Browser navigation">
            <button class="clear-btn" type="button" data-action="clear-bookmarks">Clear Bookmarks</button>
            <a class="munch-link" href="brewser://home/">Home</a>
          </nav>
        </header>
      </section>

      <p class="lead">Pages that you have bookmarked.</p>

      <section class="search-section" aria-label="Internet search">
        <browser-search></browser-search>
      </section>

      <browser-bookmarks limit="100"></browser-bookmarks>

    </div>
  </body>
</html>
