<!doctype html>
<html lang="en">
<head>
  <title>Settings — brewser</title>
  <link rel="stylesheet" href="brewser://assets/main.css">
</head>

<body>

  <section class="top-section">
    <header class="top-header">
      <h2>Settings</h2>
      <nav class="top-links" aria-label="Browser navigation">
        <a class="munch-link" href="brewser://home/">Home</a>
      </nav>
    </header>
  </section>

  <p class="lead">Core behavior settings for Brewser.</p>

  <browser-settings></browser-settings>

  <h2>Developer</h2>

  <ul class="settings-list">
    <li><a href="brewser://dev/">Dev experiments</a>
      <span class="desc">HTML / CSS / canvas / WebGL test fixtures and the full Khronos WebGL 1 / WebGL 2 conformance suites.</span>
    </li>
  </ul>

  <script>
    (function () {
      var saveBtn = document.querySelector('[data-settings-save]');
      var status = document.querySelector('[data-settings-status]');
      if (!saveBtn) return;

      function readValue(el) {
        var tag = (el.tagName || '').toUpperCase();
        var type = (el.getAttribute && el.getAttribute('type') || '').toLowerCase();
        if (tag === 'INPUT' && (type === 'checkbox' || type === 'radio')) {
          return el.checked ? '1' : '0';
        }
        return el.value != null ? String(el.value) : '';
      }

      // Re-query the widget list on every comparison and snapshot a
      // single string keyed by index + value. Re-querying (instead of
      // capturing once at script-run time) survives any DOM rebuild
      // between script-run and event-fire — the original capture went
      // stale on the later sections (Behaviour / Diagnostics
      // checkboxes), missing their change events. String compare keeps
      // radio groups correct (each radio contributes its own slot,
      // unlike a map keyed by `data-setting` which would record only
      // the first radio per group).
      function snapshot() {
        var widgets = document.querySelectorAll('[data-setting]');
        var parts = [];
        for (var i = 0; i < widgets.length; i++) {
          parts.push(i + '=' + readValue(widgets[i]));
        }
        return parts.join('|');
      }
      var baseline = snapshot();

      function recompute() {
        var dirty = snapshot() !== baseline;
        if (dirty) {
          saveBtn.removeAttribute('disabled');
          if (status) status.textContent = 'Unsaved changes.';
        } else {
          saveBtn.setAttribute('disabled', '');
          if (status) status.textContent = 'No unsaved changes.';
        }
      }

      // Event delegation on document.body for the common case. Most
      // widget taps bubble a `change` event up here and recompute fires
      // immediately. Pair with a polling tick (below) as a fallback —
      // checkbox dispatches in the live-form engine weren't reliably
      // reaching the body listener in practice, leaving the Save button
      // disabled after a toggle. 200 ms polling is imperceptible to the
      // user but guarantees the diff is re-evaluated within a few
      // animation frames of any state mutation, regardless of which
      // event path the widget took.
      document.body.addEventListener('change', recompute);
      document.body.addEventListener('input', recompute);
      setInterval(recompute, 200);
    })();
  </script>
</body>
</html>
