<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brewser Toolbar — Dark</title>
<style>
  /* Dark theme. CSS vars live on `body` instead of `:root` so the
     scope rewrite applied by populateRootFromTree (the toolbar renders
     into a separate live-DOM root, NOT under <html>) still cascades
     them to descendants. After scoping, `body { --foo: … }` becomes
     `.__brewser-toolbar-root { --foo: … }` which matches the root
     itself and inherits down. `:root` would scope to
     `.__brewser-toolbar-root :root` and never match.

     The engine paints this tree into a `canvasW × toolbarHeight` rect
     (top or bottom per `config.json toolbarPosition`). `body` uses
     `min-height: 100vh` and `vh` is scoped to the strip's own dims
     during paint, so the layout always fills the engine-supplied
     rect regardless of the configured `toolbarHeight`. */
  body {
    --bg:        #0d1426;
    --border:    #1f2c4d;
    --divider:   #1a2440;
    --txt:       #e0e8f4;
    --hint:      #7a8aa3;
    --dim:       #3a4866;
    --dot-up:    #7eda9f;
    --dot-down:  #ff7676;
    --press:     rgba(38, 50, 80, 1);
  }

  * { box-sizing: border-box; }

  body {
    /* Explicit zero margin/padding/border so any host-page rule that
       leaks via the global cascade (a class collision, a `*` reset,
       etc.) gets out-prioritised by our scoped class selector — class
       > type specificity. browser-shell.ts also tags the toolbar root
       as a `<div>` so generic host `body { … }` rules can't even
       match it via tag selectors. */
    margin: 0;
    padding: 0;
    border: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  .toolbar {
    width: 100%;
    flex-grow: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    /* Border on the edge facing the page content. Top-toolbar themes
       get a bottom border, bottom-toolbar themes a top border —
       driven by `body[data-toolbar-position]` which the engine stamps
       on mount. */
    border-bottom: 2px solid var(--border);
  }
  body[data-toolbar-position="bottom"] .toolbar {
    border-bottom: 0;
    border-top: 2px solid var(--border);
  }

  /* Chrome buttons. Sized off the strip height (every button is a
     square the height of the strip minus a sliver of breathing room).
     `data-disabled` is set by the engine for back/forward when there's
     no history in that direction AND for the bookmark button on
     non-bookmarkable pages (internal `brewser://` etc.) — greyed
     visually and the engine swallows the tap. */
  .btn {
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.1s ease;
    border-radius: 6px;
  }
  .btn img {
    width: 28px;
    height: 28px;
    display: block;
  }
  .btn[data-disabled="true"] { opacity: 0.32; cursor: default; }
  .btn:active                { background: var(--press); }

  /* Vertical hairline between the left nav cluster and the URL bar,
     and again between the URL/hint cluster and the settings button. */
  .divider {
    width: 1px;
    height: 28px;
    background: var(--divider);
    margin: 0 4px;
  }

  /* URL input. Stretches to fill remaining width via `flex: 1`. The
     engine sets its `value` on every renderChrome; tapping anywhere
     on the strip that isn't a button dispatches the `address-bar`
     intent (engine routes via `data-action`), so the user can tap the
     URL text to open the keyboard. */
  .url {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    height: 42x;
    border: 0;
    padding: 0 12px;
    font-size: 20px;
    color: var(--txt);
    font-family: inherit;
    outline: none;
  }
  .url::placeholder { color: var(--hint); }

  .mode {
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--hint);
    padding: 0 4px;
  }

  /* Network status dot. Hidden until the probe completes (engine sets
     `data-status="up|down|unknown"` once); the `unknown` rule keeps
     the slot collapsed so the URL bar reclaims the space during boot. */
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: transparent;
  }
  .dot[data-status="up"]      { background: var(--dot-up); }
  .dot[data-status="down"]    { background: var(--dot-down); }
  .dot[data-status="unknown"] { display: none; }
</style>
</head>
<body data-toolbar-position="top" data-bookmarkable="true">
  <div class="toolbar">
    <button class="btn" id="backButton"     type="button" data-action="back">
      <img src="sdmc:/switch/brewser/themes/assets/left.png" alt="Back" width="28" height="28">
    </button>
    <button class="btn" id="forwardButton"  type="button" data-action="forward">
      <img src="sdmc:/switch/brewser/themes/assets/right.png" alt="Forward" width="28" height="28">
    </button>
    <button class="btn" id="refreshButton"  type="button" data-action="reload">
      <img src="sdmc:/switch/brewser/themes/assets/refresh.png" alt="Reload" width="28" height="28">
    </button>
    <button class="btn" id="homeButton"     type="button" data-action="home">
      <img src="sdmc:/switch/brewser/themes/assets/home.png" alt="Home" width="28" height="28">
    </button>

    <span class="divider"></span>

    <button class="btn" id="bookmarkButton" type="button" data-action="star">
      <!-- `src` gets swapped by the engine between data-bookmark-true
           and data-bookmark-false on every renderChrome based on
           whether the current URL is in bookmarks.json. -->
      <img src="sdmc:/switch/brewser/themes/assets/bookmark_false.png" alt="Bookmark"
           width="22" height="22"
           data-bookmark-true="sdmc:/switch/brewser/themes/assets/bookmark_true.png"
           data-bookmark-false="sdmc:/switch/brewser/themes/assets/bookmark_false.png">
    </button>

    <input class="url" id="url" type="text" data-action="address-bar"
           readonly placeholder=" ">

    <span class="mode" id="modeLabel"></span>
    <span class="dot"  id="reachableDot" data-status="unknown"></span>

    <span class="divider"></span>

    <button class="btn" id="settingsButton" type="button" data-action="settings">
      <img src="sdmc:/switch/brewser/themes/assets/settings.png" alt="Settings" width="28" height="28">
    </button>

    <button class="btn" id="avatarButton" type="button" data-action="avatar">
      <img src="sdmc:/switch/brewser/themes/assets/avatar_default.png" alt="avatar" width="28" height="28">
    </button>

  </div>
</body>
</html>
