<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brewser Toolbar — Light</title>
<style>
  /* Light theme. Mirrors the dark theme's structure — see dark.html
     for the head-comment on scope rewriting + the `<body>`-not-`:root`
     CSS-var rule. Only the colour vars + icon paths change here. */
  body {
    --bg:        #f4f4f5;
    --border:    #c8cbd1;
    --divider:   #d1d4da;
    --txt:       #1a1a1f;
    --hint:      #6b7280;
    --dim:       #9ca3af;
    --dot-up:    #2f9d3a;
    --dot-down:  #d93030;
    --press:     rgba(0, 0, 0, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0; padding: 0; border: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  .toolbar {
    width: 100%;
    flex-grow: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    border-bottom: 2px solid var(--border);
  }
  body[data-toolbar-position="bottom"] .toolbar {
    border-bottom: 0;
    border-top: 2px solid var(--border);
  }

  .btn {
    background: none; border: 0; padding: 0; margin: 0;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.1s ease;
    border-radius: 6px;
  }
  .btn img { width: 28px; height: 28px; display: block; }
  .btn[data-disabled="true"] { opacity: 0.32; cursor: default; }
  .btn:active                { background: var(--press); }

  .divider {
    width: 1px; height: 28px;
    background: var(--divider);
    margin: 0 4px;
  }

  .url {
    flex: 1; min-width: 0;
    background: var(--bg);
    border: 0;
    height: 42x;
    padding: 0 12px;
    font-size: 20px;
    color: var(--txt);
    font-family: inherit;
    outline: none;
  }
  .url::placeholder { color: var(--hint); }

  .mode {
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--hint);
    padding: 0 4px;
  }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: transparent;
  }
  .dot[data-status="up"]      { background: var(--dot-up); }
  .dot[data-status="down"]    { background: var(--dot-down); }
  .dot[data-status="unknown"] { display: none; }
</style>
</head>
<body data-toolbar-position="top" data-bookmarkable="true">
  <div class="toolbar">
    <button class="btn" id="backButton"     type="button" data-action="back">
      <img src="sdmc:/switch/brewser/shell/assets/left_black.png" alt="Back" width="28" height="28">
    </button>
    <button class="btn" id="forwardButton"  type="button" data-action="forward">
      <img src="sdmc:/switch/brewser/shell/assets/right_black.png" alt="Forward" width="28" height="28">
    </button>
    <button class="btn" id="refreshButton"  type="button" data-action="reload">
      <img src="sdmc:/switch/brewser/shell/assets/refresh_black.png" alt="Reload" width="28" height="28">
    </button>
    <button class="btn" id="homeButton"     type="button" data-action="home">
      <img src="sdmc:/switch/brewser/shell/assets/home_black.png" alt="Home" width="28" height="28">
    </button>

    <span class="divider"></span>

    <button class="btn" id="bookmarkButton" type="button" data-action="star">
      <img src="sdmc:/switch/brewser/shell/assets/bookmark_false_black.png" alt="Bookmark"
           width="22" height="22"
           data-bookmark-true="sdmc:/switch/brewser/shell/assets/bookmark_true.png"
           data-bookmark-false="sdmc:/switch/brewser/shell/assets/bookmark_false_black.png">
    </button>

    <input class="url" id="url" type="text" data-action="address-bar"
           readonly placeholder=" ">

    <span class="mode" id="modeLabel"></span>
    <span class="dot"  id="reachableDot" data-status="unknown"></span>

    <span class="divider"></span>

    <button class="btn" id="settingsButton" type="button" data-action="settings">
      <img src="sdmc:/switch/brewser/shell/assets/settings_black.png" alt="Settings" width="28" height="28">
    </button>
  </div>
</body>
</html>
