<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brewser Toolbar — Neon</title>
<style>
  /* Windows XP "Luna" (blue) theme. See dark.html for the
     scope-rewrite + CSS-var-on-body head comment. Flat silver/cream
     toolbar strip with taupe + royal-blue chrome; no gradients/bevels
     (software-GPU path), so it's a flat reinterpretation of the Luna
     IE toolbar rather than the glossy original. */
  body {
    --bg:        #ece9d8;                /* toolbar strip — XP silver */
    --border:    #0a246a;                /* royal-blue chrome edge */
    --divider:   #aca899;                /* taupe separator */
    --txt:       #1a1a1a;                /* primary text */
    --hint:      #767060;                /* placeholder / hint grey */
    --dim:       #908d80;                /* disabled / dim */
    --accent:    #0a246a;                /* mode label — royal blue */
    --dot-up:    #3c8f3c;                /* reachable — XP green */
    --dot-down:  #c43b2f;                /* unreachable — XP red */
    --press:     rgba(28, 95, 214, 0.20);/* key-press tint — Luna blue */
    --field:     #ffffff;                /* URL field surface */
    --field-border: #7f9db9;             /* URL field sunken edge */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0; padding: 0; border: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--txt);
    font-family: Tahoma, "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  .toolbar {
    width: 100%;
    flex-grow: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    border-bottom: 2px solid var(--border);
  }
  body[data-toolbar-position="bottom"] .toolbar {
    border-bottom: 0;
    border-top: 2px solid var(--border);
  }

  .btn {
    background: none; border: 0; padding: 0; margin: 0;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.1s ease;
    border-radius: 3px;
  }
  .btn img { width: 28px; height: 28px; display: block; }
  .btn[data-disabled="true"] { opacity: 0.32; cursor: default; }
  .btn:active {
    background: var(--press);
  }

  .divider {
    width: 1px; height: 28px;
    background: var(--divider);
    margin: 0 4px;
  }

  .url {
    flex: 1; min-width: 0;
    background: var(--field);
    border: 1px solid var(--field-border);
    border-radius: 3px;
    height: 42px;
    padding: 0 12px;
    font-size: 20px;
    color: var(--txt);
    font-family: inherit;
    outline: none;
  }
  .url:focus { border-color: var(--border); }
  .url::placeholder { color: var(--hint); }

  .mode {
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--accent);
    padding: 0 4px;
  }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: transparent;
  }
  .dot[data-status="up"]      { background: var(--dot-up); }
  .dot[data-status="down"]    { background: var(--dot-down); }
  .dot[data-status="unknown"] { display: none; }
</style>
</head>
<body data-toolbar-position="top" data-bookmarkable="true">
  <div class="toolbar">
    <button class="btn" id="backButton"     type="button" data-action="back">
      <img src="sdmc:/switch/brewser/themes/assets/xp_back.png" alt="Back" width="28" height="28">
    </button>
    <button class="btn" id="forwardButton"  type="button" data-action="forward">
      <img src="sdmc:/switch/brewser/themes/assets/xp_forward.png" alt="Forward" width="28" height="28">
    </button>
    <button class="btn" id="refreshButton"  type="button" data-action="reload">
      <img src="sdmc:/switch/brewser/themes/assets/xp_refresh.png" alt="Reload" width="28" height="28">
    </button>
    <button class="btn" id="homeButton"     type="button" data-action="home">
      <img src="sdmc:/switch/brewser/themes/assets/xp_home.png" alt="Home" width="28" height="28">
    </button>

    <span class="divider"></span>

    <button class="btn" id="bookmarkButton" type="button" data-action="star">
      <img src="sdmc:/switch/brewser/themes/assets/xp_favorites_false.png" alt="Bookmark"
           width="22" height="22"
           data-bookmark-true="sdmc:/switch/brewser/themes/assets/xp_favorites_true.png"
           data-bookmark-false="sdmc:/switch/brewser/themes/assets/xp_favorites_false.png">
    </button>

    <input class="url" id="url" type="text" data-action="address-bar"
           readonly placeholder=" ">

    <span class="mode" id="modeLabel"></span>
    <span class="dot"  id="reachableDot" data-status="unknown"></span>

    <span class="divider"></span>

    <button class="btn" id="settingsButton" type="button" data-action="settings">
      <img src="sdmc:/switch/brewser/themes/assets/xp_settings.png" alt="Settings" width="28" height="28">
    </button>

    <button class="btn" id="avatarButton" type="button" data-action="avatar">
      <img src="sdmc:/switch/brewser/themes/assets/xp_avatar_default.png" alt="avatar" width="28" height="28">
    </button>

  </div>
</body>
</html>
