<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser Keyboard</title>
<style>
  /* Dark + translucent theme. CSS vars live on `body` instead of
     `:root` so the scoping rewrite applied by populateRootFromTree
     (the keyboard renders into a separate live-DOM root, NOT under
     <html>) still cascades them to descendants. After scoping
     `body { --foo: … }` becomes `.__brewser-kb-root { --foo: … }`
     which matches the kb root and inherits down. `:root` would scope
     to `.__brewser-kb-root :root` and never match. */
  body {
    /* All bgs use rgba so the host page shows through behind the
       keyboard (engine `paintKeyboardOverlay` blits the kb cache on
       top of an already-painted host frame; transparent kb pixels
       composite source-over with the host below). */
    --kbg: rgba(26, 14, 0, 0.98);     /* panel bg */
    --kkey: rgba(42, 23, 0, 1);       /* individual key bg */
    --kbord: #3d2300;
    --ktxt: #ffd35e;                  /* primary text/icon */
    --ksub: #a07000;                  /* number-key superscript */
  }

  * { box-sizing: border-box; }

  body {
    /* Explicit zero margin/padding/border so any host-page rule that
       reaches the kb root via the global cascade (a class collision,
       a `*` reset, etc.) gets out-prioritised by our scoped class
       selector — class > type specificity. Browser-shell.ts also
       tags the kb root as a `<div>` so generic host `body { … }` rules
       can't even match it via tag selectors. */
    margin: 0;
    padding: 0;
    border: 0;
    min-height: 100vh;
    /* Column flex: the panel is the only child and stretches to fill
       the whole body height (which itself fills the cache area, sized
       from `config.json keyboardHeight`). */
    display: flex;
    flex-direction: column;
    /* Transparent body so the host page is visible through every
       gap in the panel. Without this, the body would fill the entire
       kb cache area with a flat colour and defeat translucency. */
    background: transparent;
    color: var(--ktxt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .kb {
    /* Stretch top-to-bottom inside the body (which fills the
       config-sized kb cache area). `flex-grow: 1` + `flex-basis: 0`
       guarantees the panel always claims the full available height
       regardless of the `config.json keyboardHeight` value, and
       `display: flex; flex-direction: column` lets the rows below
       share that height equally. Width is 100% so there's no body bg
       leak on either side either. */
    width: 100%;
    flex-grow: 1;
    flex-shrink: 1;
    flex-basis: 0;
    display: flex;
    flex-direction: column;
    background: var(--kbg);
    padding: 14px;
    color: var(--ktxt);
  }

  .kb .row {
    display: flex;
    /* Each row claims an equal share of the panel's vertical space.
       With 6 rows, taller `keyboardHeight` values give taller rows /
       keys; smaller values shrink them proportionally. */
    flex-grow: 1;
    flex-shrink: 1;
    flex-basis: 0;
    gap: 8px;
    margin-bottom: 8px;
  }
  .kb .row:last-child { margin-bottom: 0; }

  .kb .key {
    background: var(--kkey);
    border: 1px solid var(--kbord);
    border-radius: 8px;
    /* No fixed `height` — the key inherits the row's vertical share
       via the default flex-item cross-axis stretch. Row gets taller
       when `keyboardHeight` is bumped → key gets taller in step. */
    display: flex;
    align-items: center;
    justify-content: center;
    flex-grow: 1;
    flex-shrink: 1;
    flex-basis: 0;
    font-size: 32px;
    color: var(--ktxt);
    position: relative;
    user-select: none;
    cursor: default;
    transition: background 0.1s ease;
  }

  .kb .key .sup {
    position: absolute;
    top: 5px;
    right: 8px;
    font-size: 11px;
    color: var(--ksub);
  }

  .kb .key.num { flex-direction: column; }

  .kb .wide { flex-grow: 1.6; font-size: 28px; }
  .kb .space { flex-grow: 7; }
  .kb .small { font-size: 14px; }

  .kb .url {
    /* Stretches with its row (same flex grow/shrink/basis triple as
       a key) so it scales with `config.json keyboardHeight`. The wide
       grow factor is preserved as a separate flex-grow override so it
       still owns the bulk of the row's horizontal width next to the
       Close + Clear buttons. */
    flex-grow: 9;
    flex-shrink: 1;
    flex-basis: 0;
    background: var(--kkey);
    border: 1px solid var(--kbord);
    border-radius: 8px;
    padding: 0 18px;
    font-size: 34px;
    color: var(--ktxt);
    font-family: inherit;
    outline: none;
  }
  .kb .url:focus { border-color: rgba(255, 138, 0, 0.7); }
  .kb .close,
  .kb .clear { flex-grow: 2; cursor: pointer; }

  /* Latched state (Caps / Shift held). Brighter translucent blue so
     it reads as "active" against the dark panel. */
  .kb .key.held {
    background: rgba(255, 138, 0, 0.20);
    border-color: rgba(255, 138, 0, 0.55);
  }

  /* Visual-feedback flash on keypress. The shell's keyboard handler
     calls setPseudoActive(key, true) on tap and clears after ~120 ms
     so even fast taps register visually. */
  .kb .key:active {
    background: rgba(61, 35, 0, 1);
    border-color: rgba(255, 138, 0, 0.5);
  }

  .kb .key svg { display: block; }
  /* SVG icon colours are driven by these cascade rules instead of
     inline `fill="…"` / `stroke="…"` so the theme controls colour in
     one place. Filled-only icons (Shift, ◀ ▲ ▶) read `fill`; outlined
     icons (Backspace, Tab) wear the `.outline` class and read `stroke`
     instead, with `fill` reset to `none` because they're stroked
     pentagons / arrows, not filled shapes. The svg-painter respects
     cascade-resolved fill / stroke / stroke-width via the
     `LIVE_SVG_ADAPTER` fallback when no inline attribute is set. */
  .kb .key svg          { fill: var(--ktxt); stroke: none; }
  .kb .key svg.outline  { fill: none; stroke: var(--ktxt); stroke-width: 1.6; }
</style>
</head>
<body>
  <div class="kb">
    <div class="row">
      <div class="key wide close" id="closeBtn">Close</div>
      <input type="text" class="url" id="urlInput" />
      <div class="key wide clear" id="clearBtn">Clear</div>
    </div>

    <div class="row">
      <div class="key num"><span class="sup">~</span>`</div>
      <div class="key num"><span class="sup">!</span>1</div>
      <div class="key num"><span class="sup">@</span>2</div>
      <div class="key num"><span class="sup">#</span>3</div>
      <div class="key num"><span class="sup">$</span>4</div>
      <div class="key num"><span class="sup">%</span>5</div>
      <div class="key num"><span class="sup">^</span>6</div>
      <div class="key num"><span class="sup">&amp;</span>7</div>
      <div class="key num"><span class="sup">*</span>8</div>
      <div class="key num"><span class="sup">(</span>9</div>
      <div class="key num"><span class="sup">)</span>0</div>
      <div class="key num"><span class="sup">_</span>-</div>
      <div class="key num"><span class="sup">+</span>=</div>
      <!-- Backspace ⌫ as inline SVG: pentagon outline + interior × so
           the icon renders regardless of font glyph coverage (the Switch
           font tofus U+232B). -->
      <div class="key small" data-action="backspace">
        <svg class="outline" viewBox="0 0 26 18" width="26" height="18" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 9 L9 2 L23 2 L23 16 L9 16 Z" />
          <path d="M12 5 L20 13" />
          <path d="M12 13 L20 5" />
        </svg>
      </div>
    </div>

    <div class="row">
      <!-- Tab ⇥ as inline SVG. -->
      <div class="key wide small" data-action="tab">
        <svg class="outline" viewBox="0 0 24 18" width="24" height="18" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9 L17 9" />
          <path d="M13 5 L17 9 L13 13" />
          <path d="M20 4 L20 14" />
        </svg>
      </div>
      <div class="key letter">q</div>
      <div class="key letter">w</div>
      <div class="key letter">e</div>
      <div class="key letter">r</div>
      <div class="key letter">t</div>
      <div class="key letter">y</div>
      <div class="key letter">u</div>
      <div class="key letter">i</div>
      <div class="key letter">o</div>
      <div class="key letter">p</div>
      <div class="key">\</div>
    </div>

    <div class="row">
      <div class="key wide" data-action="caps">Caps</div>
      <div class="key letter">a</div>
      <div class="key letter">s</div>
      <div class="key letter">d</div>
      <div class="key letter">f</div>
      <div class="key letter">g</div>
      <div class="key letter">h</div>
      <div class="key letter">j</div>
      <div class="key letter">k</div>
      <div class="key letter">l</div>
      <div class="key wide" data-action="return">Return</div>
    </div>

    <div class="row">
      <!-- Shift ⇧ as inline SVG: filled up-arrow. -->
      <div class="key wide small" data-action="shift">
        <svg viewBox="0 0 24 22" width="22" height="20">
          <path d="M12 3 L21 12 L16 12 L16 19 L8 19 L8 12 L3 12 Z" />
        </svg>
      </div>
      <div class="key letter">z</div>
      <div class="key letter">x</div>
      <div class="key letter">c</div>
      <div class="key letter">v</div>
      <div class="key letter">b</div>
      <div class="key letter">n</div>
      <div class="key letter">m</div>
      <div class="key">,</div>
      <div class="key">.</div>
      <div class="key">/</div>
    </div>

    <div class="row">
      
      <div class="key wide">https://</div>
      <div class="key wide">www</div>
      <div class="key wide">.com</div>

      <div class="key space" data-char=" ">&nbsp;</div>
      <div class="key">@</div>
      <div class="key">:</div>
      <div class="key">;</div>
      <div class="key">/</div>
  
    </div>
  </div>

  <!--
    Page-side input wiring used to live here. Stripped 2026-06-11 in the
    canvas → HTML keyboard rip-replace: the keyboard renders into a
    second live-DOM root that the brewser engine paints below
    KEYBOARD_LAYOUT.topY, and its key-tap dispatch + value/cursor
    bookkeeping run in the shell (see src/input/keyboard-overlay.ts).
    The original implementation depended on selectionStart /
    setSelectionRange / focus(), which the live-DOM doesn't model.

    `assets/keyboard-driver.js` is the named home for any future
    page-side glue that *would* fit the live-DOM execution model
    (cascade-style key remapping, locale-driven layouts, etc.).
  -->
</body>
</html>
